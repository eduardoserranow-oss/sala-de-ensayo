<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Lessons by SERRA</title>
  <meta name="description" content="Rutinas de guitarra, bajo y estudio vocal para practicar desde el celular, iPad o desktop." />
  <meta name="theme-color" content="#ff5a00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="My Lessons" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{--orange:#ff5a00;--orange2:#ff7a18;--text:#fff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.18)}
    *{box-sizing:border-box}html{background:#050505;scroll-behavior:smooth;scroll-snap-type:y mandatory}body{margin:0;background:#050505;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}body.is-vocal{overflow:hidden}a,button{font:inherit}.snap{scroll-snap-align:start;scroll-snap-stop:always}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:76px;display:flex;align-items:center;justify-content:center;padding:12px max(18px,env(safe-area-inset-left)) 12px max(18px,env(safe-area-inset-right));background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.2),transparent);pointer-events:none}.brand-logo{height:54px;width:auto;max-width:190px;object-fit:contain;pointer-events:auto}
    .routine-hero{min-height:100svh;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:112px clamp(22px,6vw,90px) clamp(76px,11vh,118px);background-image:linear-gradient(90deg,rgba(0,0,0,.84),rgba(0,0,0,.32) 50%,rgba(0,0,0,.12)),var(--image);background-size:cover;background-position:var(--pos,center);overflow:hidden}.routine-hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 78%,rgba(255,90,0,.12),transparent 34%),linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.5));pointer-events:none}.routine-content{position:relative;z-index:2;width:min(460px,100%);margin:0 auto;text-align:center;text-transform:uppercase}.routine-content h1{margin:0 0 18px;font-size:clamp(30px,4.4vw,50px);line-height:.96;letter-spacing:-.04em;font-weight:950;white-space:nowrap;text-shadow:0 8px 30px rgba(0,0,0,.55)}.cta-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.practice-btn{display:inline-flex;align-items:center;justify-content:center;width:min(310px,78vw);min-height:60px;padding:0 28px;background:var(--orange);color:#fff;text-decoration:none;border:0;cursor:pointer;font-size:clamp(26px,3vw,34px);font-weight:500;text-transform:none;box-shadow:0 16px 38px rgba(0,0,0,.34)}.practice-btn:hover{background:#ff6d16}.soon{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.42);color:var(--muted);font-size:11px;font-weight:900;letter-spacing:.08em}
    .wheel-section{min-height:100svh;background:#050505;padding:96px clamp(14px,3vw,40px) 58px;text-align:center;display:flex;align-items:center;justify-content:center}.wheel-app{width:min(1000px,100%);margin:auto}.note-icon{color:var(--orange);font-size:clamp(28px,4vw,42px);line-height:1;margin-bottom:8px}.wheel-app h2{margin:0 0 28px;font-size:clamp(42px,6vw,72px);line-height:.92;letter-spacing:-.055em;font-weight:950}.wheel-wrap{width:min(720px,92vw);margin:0 auto;position:relative;aspect-ratio:1/1}.wheel{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.08),transparent 34%),linear-gradient(145deg,#202020 0%,#0d0d0d 72%);border:2px solid rgba(255,255,255,.78);box-shadow:0 0 0 6px rgba(255,255,255,.03),0 18px 55px rgba(0,0,0,.45),inset 0 0 40px rgba(255,255,255,.035);overflow:hidden}.spinner-layer{position:absolute;inset:0;border-radius:50%;transition:transform 1.65s cubic-bezier(.12,.72,.10,1);will-change:transform}.spinner-layer:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -15deg,transparent 0deg 29.55deg,rgba(255,255,255,.55) 29.55deg 30deg);pointer-events:none}.ring-divider{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.68);pointer-events:none}.ring-divider.outer{width:66%;height:66%}.ring-divider.inner{width:36%;height:36%;border-color:rgba(255,255,255,.35)}.chord-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;user-select:none;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.7)}.chord-label.major{font-size:clamp(18px,3.5vw,38px);font-weight:850;letter-spacing:-.03em}.chord-label.minor{font-size:clamp(15px,2.5vw,27px);font-weight:750;color:#f0f0f0}.spin-button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1/1;border-radius:50%;border:4px solid #111;background:linear-gradient(145deg,#ff9500 0%,var(--orange) 68%,#e95300 100%);color:white;font-size:clamp(20px,3.8vw,42px);font-weight:900;letter-spacing:.02em;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 12px 28px rgba(255,106,0,.28),inset 0 2px 10px rgba(255,255,255,.15);z-index:5}.spin-button:active{transform:translate(-50%,-50%) scale(.96)}.spin-button:disabled{cursor:wait;opacity:.86}.results{margin-top:30px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.result-card{min-height:156px;padding:20px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.30);background:linear-gradient(160deg,#151515,#0d0d0d);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 26px rgba(255,255,255,.02);transition:transform .22s ease,border-color .22s ease}.result-card.reveal{transform:translateY(-4px);border-color:rgba(255,106,0,.65)}.result-title{margin-bottom:16px;color:var(--orange);font-size:clamp(11px,1.7vw,17px);font-weight:850;letter-spacing:.04em}.result-chord{font-size:clamp(30px,6.5vw,70px);line-height:1;font-weight:900;letter-spacing:-.05em;white-space:nowrap}
    .styles-section{min-height:100svh;background:#050505;padding:0 0 72px}.section-bar{height:66px;background:var(--orange);display:grid;place-items:center;color:#fff;font-size:clamp(28px,5vw,46px);font-weight:950;letter-spacing:-.035em;text-transform:uppercase}.style-grid{display:grid;grid-template-columns:repeat(3,1fr);min-height:390px}.style-card{position:relative;display:flex;align-items:flex-end;padding:34px clamp(18px,4vw,48px);color:#fff;text-decoration:none;background-image:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6)),var(--image);background-size:cover;background-position:center;overflow:hidden}.style-card:before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18);transition:background .2s ease}.style-card:hover:before{background:rgba(255,90,0,.16)}.style-card span{position:relative;z-index:2;font-size:clamp(28px,4vw,48px);line-height:.95;font-weight:950;letter-spacing:-.04em;text-transform:uppercase;text-shadow:0 5px 24px rgba(0,0,0,.5)}.tutorial-bank{min-height:260px;display:flex;align-items:center;justify-content:center;gap:clamp(24px,7vw,78px);padding:56px 24px;color:#fff;text-decoration:none;background:#050505;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}.tutorial-bank img{width:min(260px,38vw);height:auto;object-fit:contain}.divider{width:4px;height:118px;background:#fff}.tutorial-bank strong{font-size:clamp(30px,5vw,58px);line-height:1.06;text-transform:uppercase;letter-spacing:-.04em}
    .vocal-screen{display:none;position:fixed;z-index:100;inset:0;background:#050505}body.is-vocal .home-shell{display:none}body.is-vocal .vocal-screen{display:block}.vocal-frame{width:100%;height:100%;border:0;background:#050505}.vocal-back{position:fixed;z-index:101;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.64);color:#fff;border-radius:999px;min-height:44px;padding:0 16px;font-weight:900;backdrop-filter:blur(14px);cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (orientation:landscape) and (min-width:900px){.routine-hero{min-height:100svh;background-attachment:fixed}.style-grid{min-height:470px}}
    @media (max-width:760px){html{scroll-snap-type:y mandatory}.topbar{height:92px;padding-top:max(14px,env(safe-area-inset-top))}.brand-logo{height:52px;max-width:168px}.routine-hero{min-height:100svh;padding:110px 28px 112px;background-image:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.18) 35%,rgba(0,0,0,.74)),var(--image);background-position:var(--mpos,var(--pos,center))}.routine-content{width:min(100%,360px)}.routine-content h1{font-size:clamp(30px,8.8vw,38px);margin-bottom:16px;letter-spacing:-.035em}.practice-btn{width:min(302px,78vw);min-height:58px;font-size:30px;padding:0 22px}.soon{font-size:10px;min-height:36px}.wheel-section{padding:92px 10px 44px;align-items:start}.wheel-app h2{font-size:clamp(40px,11vw,58px)}.wheel-wrap{width:min(92vw,650px)}.results{gap:7px;margin-top:20px}.result-card{min-height:112px;padding:12px 5px;border-radius:14px}.result-title{margin-bottom:10px;font-size:9px}.result-chord{font-size:clamp(24px,8vw,40px)}.spin-button{border-width:3px}.style-grid{grid-template-columns:repeat(3,1fr);min-height:270px}.style-card{padding:20px 8px}.style-card span{font-size:clamp(22px,6.7vw,33px)}.tutorial-bank{min-height:230px;gap:22px}.tutorial-bank img{width:38vw}.divider{height:94px;width:3px}.tutorial-bank strong{font-size:clamp(27px,7vw,42px)}}
    @media (max-width:440px){.style-grid{min-height:240px}.style-card span{font-size:24px}.results{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="home-shell" id="home"><header class="topbar"><img class="brand-logo" src="assets/logo-my-guitar-lessons.svg" alt="My Guitar Lessons" /></header><main>
    <section class="hero-stack" aria-label="Rutinas principales">
      <article class="routine-hero snap" style="--image:url('assets/foto-guitar-routine.jpg');--pos:center top;--mpos:center top"><div class="routine-content"><h1>Guitar Routine</h1><div class="cta-row"><button class="practice-btn" data-soon="Guitar Practice">Practicar</button><span class="soon">Próximamente</span></div></div></article>
      <article class="routine-hero snap" style="--image:url('assets/foto-bass-routine.jpg');--pos:center center;--mpos:center center"><div class="routine-content"><h1>Bass Routine</h1><div class="cta-row"><button class="practice-btn" data-soon="Bass Practice">Practicar</button><span class="soon">Próximamente</span></div></div></article>
      <article class="routine-hero snap" style="--image:url('assets/foto-estudio-vocal.jpg');--pos:center center;--mpos:center center"><div class="routine-content"><h1>Estudio Vocal</h1><div class="cta-row"><button class="practice-btn" id="openVocal" type="button">Practicar</button></div></div></article>
    </section>
    <section class="wheel-section snap" id="ruleta"><div class="wheel-app"><div class="note-icon" aria-hidden="true">♫</div><h2>Ruleta de Acordes</h2><section class="wheel-wrap" aria-label="Ruleta con acordes mayores y menores"><div class="wheel"><div class="spinner-layer" id="spinnerLayer"><div class="ring-divider outer"></div><div class="ring-divider inner"></div><div id="labels"></div></div><button class="spin-button" id="spinButton" type="button" aria-label="Girar y generar cuatro acordes">GIRAR</button></div></section><section class="results" id="results" aria-label="Acordes generados"><article class="result-card"><div class="result-title">ACORDE 1</div><div class="result-chord" data-result>—</div></article><article class="result-card"><div class="result-title">ACORDE 2</div><div class="result-chord" data-result>—</div></article><article class="result-card"><div class="result-title">ACORDE 3</div><div class="result-chord" data-result>—</div></article><article class="result-card"><div class="result-title">ACORDE 4</div><div class="result-chord" data-result>—</div></article></section><div class="sr-only" id="liveRegion" aria-live="polite"></div></div></section>
    <section class="styles-section snap" aria-label="Estilos"><div class="section-bar">Estilos</div><div class="style-grid"><a class="style-card" href="https://focusclap.wixsite.com/misitio/neosoul" target="_blank" rel="noopener" style="--image:url('assets/foto-neo-soul.jpg')"><span>Neo Soul</span></a><a class="style-card" href="https://focusclap.wixsite.com/misitio/licks" target="_blank" rel="noopener" style="--image:url('assets/foto-licks.jpg')"><span>Licks</span></a><a class="style-card" href="https://focusclap.wixsite.com/misitio/tapping-1" target="_blank" rel="noopener" style="--image:url('assets/foto-articulaciones.webp')"><span>Articulación</span></a></div><a class="tutorial-bank" href="https://focusclap.wixsite.com/misitio/guitar" target="_blank" rel="noopener"><img src="assets/logo-guitar-lessons-banco.jpg" alt="My Guitar Lessons" /><span class="divider" aria-hidden="true"></span><strong>Banco de<br>Tutoriales</strong></a></section>
  </main></div><section class="vocal-screen" aria-label="Estudio vocal"><button class="vocal-back" id="closeVocal" type="button">← Home</button><iframe class="vocal-frame" id="vocalFrame" title="Estudio Vocal" data-src="estudio-vocal.html"></iframe></section>
  <script>
  document.querySelectorAll('[data-soon]').forEach(btn=>btn.addEventListener('click',()=>alert(btn.dataset.soon+' lo armamos en la próxima fase.')));const openVocal=document.getElementById('openVocal'),closeVocal=document.getElementById('closeVocal'),frame=document.getElementById('vocalFrame');function showVocal(){if(!frame.src)frame.src=frame.dataset.src;document.body.classList.add('is-vocal');history.replaceState(null,'','#estudio-vocal')}function showHome(){document.body.classList.remove('is-vocal');history.replaceState(null,'','./')}openVocal.addEventListener('click',showVocal);closeVocal.addEventListener('click',showHome);if(location.hash==='#estudio-vocal')showVocal();
  const ROOTS=[['C'],['C#','Db'],['D'],['D#','Eb'],['E'],['F'],['F#','Gb'],['G'],['G#','Ab'],['A'],['A#','Bb'],['B']];const wheelNames=['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'];const labels=document.getElementById('labels'),spinner=document.getElementById('spinnerLayer'),spinButton=document.getElementById('spinButton'),results=[...document.querySelectorAll('[data-result]')],cards=[...document.querySelectorAll('.result-card')],live=document.getElementById('liveRegion');let rotation=0,spinning=false;
  function rand(n){return Math.floor((crypto?.getRandomValues?(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296):Math.random())*n)}function pickName(i){const names=ROOTS[i];return names[rand(names.length)]}function makeChord(kind){const i=rand(ROOTS.length);return pickName(i)+(kind==='minor'?'m':'')}function fourChords(){const arr=[];for(let i=0;i<2;i++)arr.push(makeChord('major'));for(let i=0;i<2;i++)arr.push(makeChord('minor'));return arr.sort(()=>Math.random()-.5)}
  function renderLabels(){labels.innerHTML='';const size=spinner.clientWidth||700,center=size/2;wheelNames.forEach((name,i)=>{const angle=(-90+i*30)*Math.PI/180;const major=document.createElement('div');major.className='chord-label major';major.textContent=name;major.style.left=center+Math.cos(angle)*size*.36+'px';major.style.top=center+Math.sin(angle)*size*.36+'px';labels.appendChild(major);const minor=document.createElement('div');minor.className='chord-label minor';minor.textContent=name+'m';minor.style.left=center+Math.cos(angle)*size*.235+'px';minor.style.top=center+Math.sin(angle)*size*.235+'px';labels.appendChild(minor)})}
  function showResults(chords){cards.forEach(c=>c.classList.remove('reveal'));results.forEach((el,i)=>{el.textContent='—';setTimeout(()=>{el.textContent=chords[i];cards[i].classList.add('reveal')},130*i)});live.textContent='Acordes generados: '+chords.join(', ')}async function spin(){if(spinning)return;spinning=true;spinButton.disabled=true;spinButton.textContent='...';const chords=fourChords();rotation+=1080+rand(360);spinner.style.transform='rotate('+rotation+'deg)';setTimeout(()=>{showResults(chords);spinButton.textContent='GIRAR';spinButton.disabled=false;spinning=false},1700)}
  window.addEventListener('resize',()=>requestAnimationFrame(renderLabels));spinButton.addEventListener('click',spin);renderLabels();
  </script>
</body>
</html>
