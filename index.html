    .wheel-section{min-height:100svh;scroll-snap-align:start;background:#050505;padding:96px clamp(14px,3vw,40px) 58px;text-align:center;display:flex;align-items:center;justify-content:center}.wheel-app{width:min(1000px,100%);margin:auto}.note-icon{color:var(--orange);font-size:clamp(28px,4vw,42px);line-height:1;margin-bottom:8px}.wheel-app h2{margin:0 0 28px;font-size:clamp(44px,7vw,78px);line-height:.92;letter-spacing:-.055em;font-weight:950}.wheel-wrap{width:min(760px,94vw);margin:0 auto;position:relative;aspect-ratio:1/1}.wheel{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.08),transparent 34%),linear-gradient(145deg,#202020 0%,#0d0d0d 72%);border:2px solid rgba(255,255,255,.78);box-shadow:0 0 0 6px rgba(255,255,255,.03),0 18px 55px rgba(0,0,0,.45),inset 0 0 40px rgba(255,255,255,.035);overflow:hidden}.spinner-layer{position:absolute;inset:0;border-radius:50%;transform:rotate(0deg);transition:transform 1.65s cubic-bezier(.12,.72,.10,1);will-change:transform}.spinner-layer::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -15deg,transparent 0deg 29.55deg,rgba(255,255,255,.55) 29.55deg 30deg);pointer-events:none}.ring-divider{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.68);pointer-events:none}.ring-divider.outer{width:66%;height:66%}.ring-divider.inner{width:36%;height:36%;border-color:rgba(255,255,255,.35)}.chord-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;user-select:none;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.7)}.chord-label.major{font-size:clamp(18px,3.7vw,40px);font-weight:850;letter-spacing:-.03em}.chord-label.minor{font-size:clamp(15px,2.7vw,29px);font-weight:750;color:#f0f0f0}.spin-button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1/1;border-radius:50%;border:4px solid #111;background:linear-gradient(145deg,#ff9500 0%,var(--orange) 68%,#e95300 100%);color:white;font-size:clamp(20px,4vw,44px);font-weight:900;letter-spacing:.02em;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 12px 28px rgba(255,106,0,.28),inset 0 2px 10px rgba(255,255,255,.15);z-index:5}.spin-button:active{transform:translate(-50%,-50%) scale(.96)}.spin-button:disabled{cursor:wait;opacity:.86}.results{margin-top:34px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.result-card{min-height:178px;padding:22px 12px;border-radius:22px;border:1px solid rgba(255,255,255,.30);background:linear-gradient(160deg,#151515,#0d0d0d);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 26px rgba(255,255,255,.02);transition:transform .22s ease,border-color .22s ease}.result-card.reveal{transform:translateY(-4px);border-color:rgba(255,106,0,.65)}.result-title{margin-bottom:18px;color:var(--orange);font-size:clamp(11px,1.8vw,18px);font-weight:850;letter-spacing:.04em}.result-chord{font-size:clamp(32px,7vw,76px);line-height:1;font-weight:900;letter-spacing:-.05em;white-space:nowrap}
    .styles-section{scroll-snap-align:start;background:#050505;padding:0 0 82px}.section-bar{height:66px;background:var(--orange);display:grid;place-items:center;color:#fff;font-size:clamp(28px,5vw,46px);font-weight:950;letter-spacing:-.035em;text-transform:uppercase}.style-grid{display:grid;grid-template-columns:repeat(3,1fr);min-height:390px}.style-card{position:relative;display:flex;align-items:flex-end;padding:34px clamp(18px,4vw,48px);color:#fff;text-decoration:none;background-image:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6)),var(--image);background-size:cover;background-position:center;overflow:hidden}.style-card::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18);transition:background .2s ease}.style-card:hover::before{background:rgba(255,90,0,.16)}.style-card span{position:relative;z-index:2;font-size:clamp(28px,4vw,48px);line-height:.95;font-weight:950;letter-spacing:-.04em;text-transform:uppercase;text-shadow:0 5px 24px rgba(0,0,0,.5)}.tutorial-bank{min-height:260px;display:flex;align-items:center;justify-content:center;gap:clamp(24px,7vw,78px);padding:56px 24px;color:#fff;text-decoration:none;background:#050505;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}.tutorial-bank img{width:min(260px,38vw);height:auto;object-fit:contain}.divider{width:4px;height:118px;background:#fff}.tutorial-bank strong{font-size:clamp(30px,5vw,58px);line-height:1.06;text-transform:uppercase;letter-spacing:-.04em}.home-footer{display:flex;justify-content:center;padding:28px 24px max(42px,env(safe-area-inset-bottom));background:#050505}.logout-button{border:1px solid rgba(255,90,0,.55);border-radius:999px;background:transparent;color:var(--orange);min-height:44px;padding:0 22px;font-size:14px;font-weight:950;cursor:pointer}
    .vocal-screen{display:none;position:fixed;z-index:100;inset:0;background:#050505}body.is-vocal .home-shell{display:none}body.is-vocal .vocal-screen{display:block}.vocal-frame{width:100%;height:100%;border:0;background:#050505}.vocal-back{position:fixed;z-index:101;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.64);color:#fff;border-radius:999px;min-height:44px;padding:0 16px;font-weight:900;backdrop-filter:blur(14px);cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (orientation:landscape) and (min-width:900px){.routine-hero{min-height:820px;background-attachment:fixed}.routine-content{margin-bottom:2vh}.style-grid{min-height:470px}}
    @media (max-width:760px){.topbar{height:86px;padding-top:max(12px,env(safe-area-inset-top))}.brand-logo{height:48px;max-width:154px}.routine-hero{min-height:100svh;padding:105px 28px 88px;background-image:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.2) 35%,rgba(0,0,0,.84)),var(--image);background-position:var(--mpos,var(--pos,center))}.routine-content h1{font-size:clamp(28px,9vw,39px);margin-bottom:14px}.practice-btn{width:min(100%,302px);min-height:58px;font-size:26px;padding:0 26px}.soon{font-size:10px}.wheel-section{padding:90px 10px 44px;align-items:start}.wheel-app h2{font-size:clamp(42px,12vw,62px)}.wheel-wrap{width:min(94vw,680px)}.results{gap:7px;margin-top:20px}.result-card{min-height:118px;padding:13px 5px;border-radius:14px}.result-title{margin-bottom:10px;font-size:9px}.result-chord{font-size:clamp(24px,8.5vw,42px)}.spin-button{border-width:3px}.style-grid{grid-template-columns:repeat(3,1fr);min-height:270px}.style-card{padding:20px 8px;background-position:center}.style-card span{font-size:clamp(22px,7vw,34px)}.tutorial-bank{min-height:230px;gap:22px}.tutorial-bank img{width:38vw}.divider{height:94px;width:3px}.tutorial-bank strong{font-size:clamp(27px,7vw,42px)}}
    @media (max-width:760px){.home-auth-gate{place-items:start center;padding-top:max(58px,env(safe-area-inset-top));padding-bottom:max(22px,env(safe-area-inset-bottom))}.home-auth-card{padding:22px 18px 20px;border-radius:20px}.home-auth-card img{width:min(170px,46vw);margin-bottom:18px}.home-auth-card h2{font-size:clamp(28px,8vw,36px)}}
    @media (max-width:440px){.style-grid{min-height:240px}.style-card span{font-size:25px}.results{grid-template-columns:repeat(4,minmax(0,1fr))}}

<body>
  <div class="app-splash" id="appSplash" aria-hidden="true"><img src="assets/logo-my-guitar-lessons.svg?v=logo3" alt="" fetchpriority="high" decoding="sync" /></div>
  <div class="home-shell" id="home"><header class="topbar"><a class="brand-link" href="./" aria-label="Ir al Home"><img class="brand-logo" src="assets/logo-my-guitar-lessons.svg?v=logo2" alt="My Guitar Lessons" /></a></header><main>
    <section class="hero-stack" aria-label="Rutinas principales">
      <article class="routine-hero" style="--image:url('assets/foto-guitar-routine.jpg');--pos:center top;--mpos:center top"><div class="routine-content"><h1>Guitar Routine</h1><div class="cta-row"><a class="practice-btn" href="guitar-practice.html?v=cachefix3">Practicar</a></div></div></article>
      <article class="routine-hero" style="--image:url('assets/foto-bass-routine.jpg');--pos:center center;--mpos:center center"><div class="routine-content"><h1>Bass Routine</h1><div class="cta-row"><a class="practice-btn" href="bass-practice.html?v=cachefix3">Practicar</a></div></div></article>
      <article class="routine-hero" style="--image:url('assets/foto-estudio-vocal.jpg');--pos:center center;--mpos:center center"><div class="routine-content"><h1>Estudio Vocal</h1><div class="cta-row"><button class="practice-btn" id="openVocal" type="button">Practicar</button></div></div></article>
    </section>
    <section class="wheel-section" id="ruleta"><div class="wheel-app"><div class="note-icon" aria-hidden="true">♫</div><h2>Ruleta de Acordes</h2><section class="wheel-wrap" aria-label="Ruleta con acordes mayores y menores"><div class="wheel"><div class="spinner-layer" id="spinnerLayer"><div class="ring-divider outer"></div><div class="ring-divider inner"></div><div id="labels"></div></div><button class="spin-button" id="spinButton" type="button" aria-label="Girar y generar cuatro acordes">GIRAR</button></div></section><section class="results" id="results" aria-label="Acordes generados"><article class="result-card"><div class="result-title">ACORDE 1</div><div class="result-chord" data-result>—</div></article><article class="result-card"><div class="result-title">ACORDE 2</div><div class="result-chord" data-result>—</div></article><article class="result-card"><div class="result-title">ACORDE 3</div><div class="result-chord" data-result>—</div></article><article class="result-card"><div class="result-title">ACORDE 4</div><div class="result-chord" data-result>—</div></article></section><div class="sr-only" id="liveRegion" aria-live="polite"></div></div></section>
    <section class="styles-section" aria-label="Estilos"><div class="section-bar">Estilos</div><div class="style-grid"><a class="style-card" href="https://focusclap.wixsite.com/misitio/neosoul" target="_blank" rel="noopener" style="--image:url('assets/foto-neo-soul.jpg')"><span>Neo Soul</span></a><a class="style-card" href="https://focusclap.wixsite.com/misitio/licks" target="_blank" rel="noopener" style="--image:url('assets/foto-licks.jpg')"><span>Licks</span></a><a class="style-card" href="https://focusclap.wixsite.com/misitio/tapping-1" target="_blank" rel="noopener" style="--image:url('assets/foto-articulaciones.webp')"><span>Articulación</span></a></div><a class="tutorial-bank" href="https://focusclap.wixsite.com/misitio/guitar" target="_blank" rel="noopener"><img src="assets/logo-guitar-lessons-banco.jpg" alt="My Guitar Lessons" /><span class="divider" aria-hidden="true"></span><strong>Banco de<br>Tutoriales</strong></a><footer class="home-footer"><button class="logout-button" id="logoutButton" type="button">Cerrar sesión</button></footer></section>
  </main></div><section class="vocal-screen" aria-label="Estudio vocal"><button class="vocal-back" id="closeVocal" type="button">← Home</button><iframe class="vocal-frame" id="vocalFrame" title="Estudio Vocal" data-src="estudio-vocal.html"></iframe></section>
  <script src="assets/home-auth.js?v=pin3-tuner4-sghero2"></script>
  <script>
  const openVocal=document.getElementById('openVocal'),closeVocal=document.getElementById('closeVocal'),frame=document.getElementById('vocalFrame');function showVocal(){if(!frame.src)frame.src=frame.dataset.src;document.body.classList.add('is-vocal');history.replaceState(null,'','#estudio-vocal')}function showHome(){document.body.classList.remove('is-vocal');history.replaceState(null,'','./')}openVocal.addEventListener('click',showVocal);closeVocal.addEventListener('click',showHome);if(location.hash==='#estudio-vocal')showVocal();
  const ROOTS=[{wheel:"C",names:["C"]},{wheel:"C#/Db",names:["C#","Db"]},{wheel:"D",names:["D"]},{wheel:"D#/Eb",names:["D#","Eb"]},{wheel:"E",names:["E"]},{wheel:"F",names:["F"]},{wheel:"F#/Gb",names:["F#","Gb"]},{wheel:"G",names:["G"]},{wheel:"G#/Ab",names:["G#","Ab"]},{wheel:"A",names:["A"]},{wheel:"A#/Bb",names:["A#","Bb"]},{wheel:"B",names:["B"]}];
  const labelsEl=document.getElementById("labels"),spinnerLayer=document.getElementById("spinnerLayer"),spinButton=document.getElementById("spinButton"),resultEls=[...document.querySelectorAll("[data-result]")],cards=[...document.querySelectorAll(".result-card")],liveRegion=document.getElementById("liveRegion");let rotation=0,majorBag=[],minorBag=[],spinning=false;
  function randomFloat(){if(window.crypto?.getRandomValues){const array=new Uint32Array(1);window.crypto.getRandomValues(array);return array[0]/4294967296}return Math.random()}
  function shuffle(array){const copy=[...array];for(let i=copy.length-1;i>0;i--){const j=Math.floor(randomFloat()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
  function refillBag(){return shuffle(ROOTS.map((_,index)=>index))}
  function drawFromBag(type,count){let bag=type==="major"?majorBag:minorBag;if(bag.length<count)bag=refillBag();const picked=bag.splice(0,count);if(type==="major")majorBag=bag;else minorBag=bag;return picked}
  function chooseDisplayName(rootIndex){const options=ROOTS[rootIndex].names;return options[Math.floor(randomFloat()*options.length)]}
  function makeChord(rootIndex,quality){const root=chooseDisplayName(rootIndex);return quality==="minor"?`${root}m`:root}
  function generateFourChords(){const majors=drawFromBag("major",2).map(index=>({rootIndex:index,quality:"major",text:makeChord(index,"major")}));const minors=drawFromBag("minor",2).map(index=>({rootIndex:index,quality:"minor",text:makeChord(index,"minor")}));return shuffle([...majors,...minors])}
  function renderWheelLabels(){labelsEl.innerHTML="";const size=spinnerLayer.clientWidth,center=size/2,majorRadius=size*.405,minorRadius=size*.285;ROOTS.forEach((root,index)=>{const angle=(index*30-90)*Math.PI/180;const major=document.createElement("div");major.className="chord-label major";major.textContent=root.wheel;major.style.left=`${center+Math.cos(angle)*majorRadius}px`;major.style.top=`${center+Math.sin(angle)*majorRadius}px`;labelsEl.appendChild(major);const minor=document.createElement("div");minor.className="chord-label minor";minor.textContent=root.names.length===2?`${root.names[0]}m/${root.names[1]}m`:`${root.names[0]}m`;minor.style.left=`${center+Math.cos(angle)*minorRadius}px`;minor.style.top=`${center+Math.sin(angle)*minorRadius}px`;labelsEl.appendChild(minor)})}
  function showResults(chords){cards.forEach(card=>card.classList.remove("reveal"));resultEls.forEach((el,index)=>el.textContent=chords[index].text);requestAnimationFrame(()=>cards.forEach((card,index)=>setTimeout(()=>card.classList.add("reveal"),index*70)));liveRegion.textContent=`Acordes generados: ${chords.map(chord=>chord.text).join(", ")}`}
  async function spin(){if(spinning)return;spinning=true;spinButton.disabled=true;spinButton.textContent="...";const chords=generateFourChords();const fullTurns=5+Math.floor(randomFloat()*4);const direction=randomFloat()<.5?-1:1;rotation+=fullTurns*360*direction;spinnerLayer.style.transform=`rotate(${rotation}deg)`;await new Promise(resolve=>setTimeout(resolve,1650));showResults(chords);spinButton.textContent="GIRAR";spinButton.disabled=false;spinning=false}
  majorBag=refillBag();minorBag=refillBag();renderWheelLabels();let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderWheelLabels,80)});spinButton.addEventListener("click",spin);
  </script>
