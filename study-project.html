<!doctype html>
<html lang="es"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><title>Constructor | FORTISSIMO</title><meta name="theme-color" content="#050505" /><link rel="icon" type="image/svg+xml" href="assets/fortissimo-icon-20260824.svg" />
<style>
:root{--orange:#ff5a00;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.13)}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 78% 0,rgba(255,90,0,.13),transparent 30%),#050505;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{position:sticky;top:0;z-index:30;height:82px;display:grid;grid-template-columns:100px 1fr 100px;align-items:center;padding:0 20px;background:#050505;border-bottom:1px solid rgba(255,255,255,.07)}.topbar a{color:#fff;text-decoration:none;font-size:14px;font-weight:850}.brand{justify-self:center}.logo{display:block;width:220px;max-width:55vw}.shell{width:min(1040px,calc(100% - 32px));margin:auto;padding:48px 0 90px}.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end}.eyebrow{margin:0;color:#ff9860;font-size:12px;font-weight:950;letter-spacing:.14em;text-transform:uppercase}h1{margin:9px 0 0;font-size:clamp(46px,7vw,78px);line-height:.9;letter-spacing:-.06em}.objective{max-width:720px;margin:18px 0 0;color:#c7c7c7;font-size:17px;line-height:1.55}.primary{min-height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--orange);color:#fff;font:inherit;font-size:14px;font-weight:950;cursor:pointer}.route-head{display:flex;justify-content:space-between;align-items:center;margin:48px 0 16px}.route-head h2{margin:0;font-size:28px;letter-spacing:-.04em}.route-head span{color:var(--muted);font-size:13px}.empty{padding:38px;border:1px dashed rgba(255,255,255,.2);border-radius:20px;color:#aaa;text-align:center}.empty strong{display:block;color:#fff;font-size:22px}.empty p{margin:8px auto 0;max-width:470px;line-height:1.5}.stages{display:grid;gap:12px}.stage{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#161616,#0c0c0c);transition:border-color .18s,transform .18s}.stage.dragging{opacity:.4}.stage.drag-over{border-color:var(--orange);transform:translateY(2px)}.number{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;background:rgba(255,90,0,.12);color:var(--orange);font-size:14px;font-weight:950}.stage h3{margin:0;font-size:21px;letter-spacing:-.025em}.song-line{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;color:#aaa;font-size:13px}.song-line b{color:#fff}.stage-actions{display:flex;gap:7px}.small{width:40px;height:40px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:#111;color:#fff;font-size:15px;cursor:pointer}.edit{width:auto;padding:0 13px;font-size:12px;font-weight:850}.delete{color:#ff8870}.drag-hint{margin:12px 0 0;color:#777;font-size:12px;text-align:right}dialog{width:min(720px,calc(100% - 20px));max-height:calc(100svh - 24px);overflow:auto;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:#111;color:#fff;padding:0;box-shadow:0 35px 100px rgba(0,0,0,.75)}dialog::backdrop{background:rgba(0,0,0,.8)}.modal{padding:27px}.modal h2{margin:0;font-size:32px;letter-spacing:-.04em}.section-label{margin:26px 0 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);color:#ff9860;font-size:12px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px;margin-top:16px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:850}.field input,.field textarea{width:100%;min-height:48px;border:1px solid rgba(255,255,255,.15);border-radius:11px;background:#080808;color:#fff;padding:11px 13px;font:inherit;font-size:16px}.field textarea{min-height:86px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.secondary{min-height:48px;padding:0 17px;border:1px solid rgba(255,255,255,.17);border-radius:12px;background:transparent;color:#fff;font:inherit;font-weight:850;cursor:pointer}
@media(max-width:700px){.topbar{height:calc(74px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:70px 1fr 70px}.logo{width:174px}.topbar>a:first-child{font-size:0}.topbar>a:first-child::after{content:"← Projects";font-size:12px}.shell{width:calc(100% - 24px);padding-top:30px}.hero{grid-template-columns:1fr}.hero .primary{width:100%}.stage{grid-template-columns:46px minmax(0,1fr);padding:16px;gap:12px}.number{width:42px;height:42px}.stage-actions{grid-column:1/-1;justify-content:flex-end}.drag-hint{text-align:center}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:21px}}
</style></head>
<body><header class="topbar fortissimo-app-header"><a href="study-projects.html">← Proyectos</a><a class="brand" href="index.html?internal=1&return=studypaths"><img class="logo" src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO" /></a><span></span></header>
<main class="shell" id="root"></main>
<dialog id="stageDialog"><form class="modal" id="stageForm"><h2 id="dialogTitle">Nueva etapa</h2><input type="hidden" name="stageId" /><div class="fields"><div class="field full"><label>Título de la etapa</label><input name="title" required maxlength="90" placeholder="Ej. Funk → Funk moderno" /></div><div class="field full"><label>Objetivo de la etapa</label><textarea name="objective" required maxlength="320" placeholder="¿Qué desarrollará esta etapa?"></textarea></div></div><p class="section-label">Canción A · Aprende el lenguaje</p><div class="fields"><div class="field"><label>Artista</label><input name="aArtist" required maxlength="90" /></div><div class="field"><label>Canción</label><input name="aTitle" required maxlength="120" /></div><div class="field full"><label>Qué estudiar</label><textarea name="aStudy" required maxlength="400"></textarea></div></div><p class="section-label">Canción B · Aplica el lenguaje</p><div class="fields"><div class="field"><label>Artista</label><input name="bArtist" required maxlength="90" /></div><div class="field"><label>Canción</label><input name="bTitle" required maxlength="120" /></div><div class="field full"><label>Qué estudiar</label><textarea name="bStudy" required maxlength="400"></textarea></div><div class="field full"><label>Conexión A → B</label><textarea name="connection" required maxlength="500" placeholder="¿Cómo la canción B aplica o evoluciona lo aprendido en A?"></textarea></div></div><div class="modal-actions"><button class="secondary" type="button" data-close>Cancelar</button><button class="primary" type="submit">Guardar etapa</button></div></form></dialog>
<script src="assets/study-projects-v1.js?v=phase7-final"></script><script>
const id=new URLSearchParams(location.search).get("id"),root=document.getElementById("root"),dialog=document.getElementById("stageDialog"),form=document.getElementById("stageForm");let draggedIndex=null;
const esc=value=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
function project(){return FortissimoProjects.get(id)}
function render(){const item=project();if(!item||item.archived){root.innerHTML='<p class="eyebrow">Study Paths</p><h1>Proyecto no disponible</h1>';return}document.title=`${item.name} | FORTISSIMO`;const stages=item.stages||[],sourceLabel=item.sourceId==="ai-builder"?"AI Study Path":"Manual Study Path";root.innerHTML=`<section class="hero"><div><p class="eyebrow">${esc(item.instrument)} · ${sourceLabel}</p><h1>${esc(item.name)}</h1><p class="objective">${esc(item.objective)}</p></div><button class="primary" type="button" data-add>+ Agregar etapa</button></section><div class="route-head"><h2>Tu recorrido</h2><span>${stages.length} ${stages.length===1?"etapa":"etapas"} · ${stages.length*2} canciones</span></div><section class="stages">${stages.length?stages.map((stage,index)=>stageCard(stage,index,stages.length)).join(""):`<div class="empty"><strong>Comienza tu primera etapa</strong><p>Agrega una dupla de canciones y explica qué conecta el aprendizaje de A con la aplicación en B.</p></div>`}</section>${stages.length>1?'<p class="drag-hint">Arrastra las etapas para ordenarlas o usa ↑ ↓ en móvil.</p>':""}`;bind()}
function stageCard(stage,index,total){return`<article class="stage" draggable="true" data-index="${index}"><div class="number">${String(index+1).padStart(2,"0")}</div><div><h3>${esc(stage.title)}</h3><div class="song-line"><span><b>A</b> ${esc(stage.a.artist)} — ${esc(stage.a.title)}</span><span><b>B</b> ${esc(stage.b.artist)} — ${esc(stage.b.title)}</span></div></div><div class="stage-actions"><button class="small" data-up="${index}" ${index===0?"disabled":""} aria-label="Subir etapa">↑</button><button class="small" data-down="${index}" ${index===total-1?"disabled":""} aria-label="Bajar etapa">↓</button><button class="small edit" data-edit="${esc(stage.id)}">Editar</button><button class="small delete" data-delete="${esc(stage.id)}" aria-label="Eliminar etapa">×</button></div></article>`}
function openStage(stage=null){form.reset();form.elements.stageId.value=stage?.id||"";document.getElementById("dialogTitle").textContent=stage?"Editar etapa":"Nueva etapa";if(stage){const values={title:stage.title,objective:stage.objective,aArtist:stage.a.artist,aTitle:stage.a.title,aStudy:stage.a.study,bArtist:stage.b.artist,bTitle:stage.b.title,bStudy:stage.b.study,connection:stage.connection};Object.entries(values).forEach(([name,value])=>form.elements[name].value=value)}dialog.showModal()}
function bind(){document.querySelector("[data-add]")?.addEventListener("click",()=>openStage());document.querySelectorAll("[data-edit]").forEach(button=>button.onclick=()=>openStage(project().stages.find(stage=>stage.id===button.dataset.edit)));document.querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>{if(confirm("¿Eliminar esta etapa del proyecto?")){FortissimoProjects.removeStage(id,button.dataset.delete);render()}});document.querySelectorAll("[data-up]").forEach(button=>button.onclick=()=>{FortissimoProjects.moveStage(id,Number(button.dataset.up),Number(button.dataset.up)-1);render()});document.querySelectorAll("[data-down]").forEach(button=>button.onclick=()=>{FortissimoProjects.moveStage(id,Number(button.dataset.down),Number(button.dataset.down)+1);render()});document.querySelectorAll(".stage").forEach(card=>{card.addEventListener("dragstart",()=>{draggedIndex=Number(card.dataset.index);card.classList.add("dragging")});card.addEventListener("dragend",()=>{card.classList.remove("dragging");document.querySelectorAll(".stage").forEach(item=>item.classList.remove("drag-over"))});card.addEventListener("dragover",event=>{event.preventDefault();card.classList.add("drag-over")});card.addEventListener("dragleave",()=>card.classList.remove("drag-over"));card.addEventListener("drop",event=>{event.preventDefault();FortissimoProjects.moveStage(id,draggedIndex,Number(card.dataset.index));render()})})}
form.addEventListener("submit",event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));FortissimoProjects.saveStage(id,data,data.stageId||null);dialog.close();render()});document.querySelector("[data-close]").onclick=()=>dialog.close();dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});render();
</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
