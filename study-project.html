<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Study Path | FORTISSIMO</title><meta name="theme-color" content="#050505"><link rel="icon" href="assets/fortissimo-icon-20260824.svg"><style>:root{--o:#ff6a00;--bg:#07090b;--muted:#a5abb0;--line:rgba(255,255,255,.1);--green:#2fa55d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,a{font:inherit}.top{height:76px;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,9,11,.95);z-index:20}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:850}.brand{justify-self:center}.brand img{width:190px}.shell{width:min(820px,calc(100% - 28px));margin:auto;padding:24px 0 88px}.titlebar{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center}.backCircle,.iconBtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#101418;color:#fff;text-decoration:none;font-size:18px}.titlebar h1{margin:0;font-size:25px;line-height:1.05}.titlebar small{color:#ff9d59}.titleActions{display:flex;gap:8px}.summary{display:grid;grid-template-columns:150px 1fr;margin-top:18px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#11161a}.cover{position:relative;min-height:190px;background:radial-gradient(circle at 70% 20%,rgba(255,106,0,.35),transparent 30%),linear-gradient(135deg,#31383d,#111);background-position:center;background-size:cover}.cover button{position:absolute;right:8px;bottom:8px;border:1px solid #ffffff2b;border-radius:10px;background:#000b;color:#fff;padding:8px;font-size:11px;font-weight:850}.summaryBody{padding:18px}.summaryBody b{color:#ff9d59}.summaryBody p{margin:6px 0 14px;color:#d4d7d9;font-size:13px;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-top:14px}.stat{text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}.progressRing{color:var(--o)}.sectionTitle{margin:22px 0 10px;color:#aeb4b8;font-size:13px;text-transform:uppercase}.stages{display:grid;gap:8px}.stage{display:grid;grid-template-columns:32px minmax(0,1fr) 24px;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#11161a;color:#fff;text-decoration:none}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #596168}.stage.done .dot{background:var(--green);border-color:var(--green)}.stage.current{border-color:var(--o)}.stage.current .dot{border-color:var(--o)}.stage.locked{opacity:.56}.stage h3{margin:0;font-size:15px}.songs{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chev{font-size:22px;color:#b7bcc0}.empty{padding:34px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}dialog{width:min(460px,calc(100% - 24px));border:1px solid #ffffff26;border-radius:20px;background:#11161a;color:#fff;padding:0}dialog::backdrop{background:#000c}.modal{padding:22px}.modal h2{margin:0 0 7px}.modal p{margin:0 0 16px;color:var(--muted);font-size:13px}.coverActions{display:grid;gap:9px}.coverAction,.close{min-height:48px;border:1px solid var(--line);border-radius:12px;background:#0b0f12;color:#fff;padding:0 14px;font-weight:850}.coverAction{text-align:left}.coverAction.primary{background:var(--o);border-color:var(--o)}.coverAction:disabled,.close:disabled{opacity:.4}.close{width:100%;margin-top:14px}.note{margin-top:12px;color:#777f84;font-size:11px}.aiStatus{display:none;margin:0 0 12px;padding:9px 11px;border-radius:10px;background:#ff6a0014;color:#ffad75;font-size:12px;font-weight:800}.aiStatus.show{display:block}@media(max-width:620px){.top{height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:64px 1fr 64px}.brand img{width:164px}.top>a:first-child{font-size:0}.top>a:first-child:after{content:"← Rutas";font-size:12px}.shell{padding-top:18px}.summary{grid-template-columns:112px 1fr}.cover{min-height:170px}.summaryBody{padding:14px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat:nth-child(2){border-right:0}.titlebar h1{font-size:20px}}</style></head><body><header class="top"><a href="study-projects.html">← Proyectos</a><a class="brand" href="index.html?internal=1&return=studypaths"><img src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO"></a><span></span></header><main class="shell" id="root"></main><dialog id="coverDlg"><div class="modal"><h2>Portada del Study Path</h2><p>Genera una portada para esta ruta, usa tu propia imagen o vuelve a la primera portada creada por IA.</p><div class="aiStatus" id="aiStatus">Generando portada…</div><div class="coverActions"><button class="coverAction primary" id="generateBtn">✦ Generar con IA</button><button class="coverAction" id="uploadBtn">Subir mi imagen</button><button class="coverAction" id="restoreBtn">Restaurar IA original</button><button class="coverAction" id="resetBtn">Usar portada IA</button></div><div class="note">La primera portada creada por IA queda guardada como original. Las imágenes se almacenan fuera del progreso del Study Path.</div><button class="close" id="closeCover">Cerrar</button><input id="coverFile" type="file" accept="image/*" hidden></div></dialog><script src="assets/study-projects-v1.js?v=rebuild2"></script><script src="assets/study-path-progress-v2.js?v=rebuild2"></script><script src="assets/study-path-covers-v1.js?v=cover55"></script><script>const q=new URLSearchParams(location.search),id=q.get('id')||FortissimoProjects.ROAD_ID,root=document.getElementById('root'),dlg=document.getElementById('coverDlg'),file=document.getElementById('coverFile'),statusEl=document.getElementById('aiStatus'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let coverBusy=false;function setCoverBusy(v){coverBusy=v;statusEl.classList.toggle('show',v);['generateBtn','uploadBtn','restoreBtn','resetBtn','closeCover'].forEach(k=>document.getElementById(k).disabled=v)}async function paint(){const el=root.querySelector('.cover');if(!el)return;const c=await FortissimoPathCovers.resolve(id),m=FortissimoPathCovers.meta(id);if(c.url)el.style.backgroundImage=`linear-gradient(180deg,#0000,#0006),url("${c.url.replace(/"/g,'%22')}")`;else if(id===FortissimoProjects.ROAD_ID)el.style.backgroundImage="linear-gradient(180deg,#0000,#0006),url('assets/foto-guitar-routine-hd.avif?v=guitarhd2')";else el.style.backgroundImage='radial-gradient(circle at 70% 20%,rgba(255,106,0,.35),transparent 30%),linear-gradient(135deg,#31383d,#111)';document.getElementById('generateBtn').textContent=FortissimoPathCovers.hasAI(id)?'✦ Generar otra con IA':'✦ Generar con IA';document.getElementById('restoreBtn').disabled=coverBusy||!m.hasAiOriginal;document.getElementById('resetBtn').disabled=coverBusy||c.source!=='custom'||!FortissimoPathCovers.hasAI(id)}function render(){const p=FortissimoProjects.get(id);if(!p||p.archived){root.innerHTML='<div class="empty">Ruta no disponible.</div>';return}FortissimoPathProgress.setActive(p.id);const s=FortissimoPathProgress.stats(p.id,p.stages),edit=p.system?'':`<a class="iconBtn" href="study-project-edit.html?id=${encodeURIComponent(p.id)}">✎</a><a class="iconBtn" href="study-path-adapt.html?id=${encodeURIComponent(p.id)}">✦</a>`;root.innerHTML=`<section class="titlebar"><a class="backCircle" href="study-projects.html">←</a><div><small>${esc(p.instrument)}</small><h1>${esc(p.name)}</h1></div><div class="titleActions">${edit}</div></section><section class="summary"><div class="cover"><button id="coverBtn">Cambiar portada</button></div><div class="summaryBody"><b>Objetivo del plan</b><p>${esc(p.objective)}</p><div class="stats"><div class="stat"><strong>${s.totalStages}</strong><span>Stages</span></div><div class="stat"><strong>${s.totalSongs}</strong><span>Canciones</span></div><div class="stat"><strong>${esc(p.duration||'A tu ritmo')}</strong><span>Duración</span></div><div class="stat progressRing"><strong>${s.percent}%</strong><span>${s.learned}/${s.totalSongs}</span></div></div></div></section><h2 class="sectionTitle">Etapas</h2><section class="stages">${p.stages.map((st,i)=>{const x=FortissimoPathProgress.stageState(p.id,st,p.stages),u=FortissimoPathProgress.isUnlocked(p.id,i,p.stages),done=x.completed,cur=!done&&i===s.current-1,cl=done?'done':cur?'current':u?'':'locked';return`<a class="stage ${cl}" ${u?`href="study-stage.html?id=${encodeURIComponent(p.id)}&stage=${i+1}"`:'href="#" aria-disabled="true"'}><span class="dot">${done?'✓':u?'':'🔒'}</span><div><h3>${String(i+1).padStart(2,'0')}. ${esc(st.title)}</h3><div class="songs">${esc(st.a.artist)} - ${esc(st.a.title)} / ${esc(st.b.artist)} - ${esc(st.b.title)}</div></div><span class="chev">›</span></a>`}).join('')}</section>`;root.querySelectorAll('[aria-disabled=true]').forEach(a=>a.onclick=e=>e.preventDefault());document.getElementById('coverBtn').onclick=()=>{paint();dlg.showModal()};paint()}document.getElementById('generateBtn').onclick=async()=>{if(coverBusy)return;const p=FortissimoProjects.get(id);if(!p)return;setCoverBusy(true);try{await FortissimoPathCovers.generate(id,p);await paint()}catch(e){alert(e.message||'No se pudo generar la portada.')}finally{setCoverBusy(false);paint()}};document.getElementById('uploadBtn').onclick=()=>!coverBusy&&file.click();file.onchange=async()=>{if(!file.files[0])return;try{await FortissimoPathCovers.setCustom(id,file.files[0]);await paint()}catch(e){alert(e.message)}file.value=''};document.getElementById('restoreBtn').onclick=async()=>{if(coverBusy)return;await FortissimoPathCovers.restoreAIOriginal(id);await paint()};document.getElementById('resetBtn').onclick=async()=>{if(coverBusy)return;await FortissimoPathCovers.resetAI(id);await paint()};document.getElementById('closeCover').onclick=()=>{if(!coverBusy)dlg.close()};render();window.addEventListener('fortissimo:path-progress',render);window.addEventListener('fortissimo:path-cover',paint);</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
