const qs=new URLSearchParams(location.search),id=qs.get("id")||FortissimoProjects.ROAD_ID,root=document.getElementById("root"),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));function render(){const p=FortissimoProjects.get(id);if(!p||p.archived){root.innerHTML='<div class="empty">Ruta no disponible.<br><a href="study-projects.html" style="color:#ff9d59">Volver a Study Paths</a></div>';return}FortissimoPathProgress.setActive(p.id);const s=FortissimoPathProgress.stats(p.id,p.stages);document.title=`${p.name} | FORTISSIMO`;const edit=p.system?"":`<a class="iconBtn" title="Editar" href="study-project-edit.html?id=${encodeURIComponent(p.id)}">✎</a><a class="iconBtn" title="Adaptar con IA" href="study-path-adapt.html?id=${encodeURIComponent(p.id)}">✦</a>`;root.innerHTML=`<section class="titlebar"><a class="backCircle" href="study-projects.html">←</a><div><small>${esc(p.instrument)}</small><h1>${esc(p.name)}</h1></div><div class="titleActions">${edit}</div></section><section class="summary"><div class="cover"></div><div class="summaryBody"><b>Objetivo del plan</b><p>${esc(p.objective)}</p><div class="stats"><div class="stat"><strong>${s.totalStages}</strong><span>Stages</span></div><div class="stat"><strong>${s.totalSongs}</strong><span>Canciones</span></div><div class="stat"><strong>${esc(p.duration||"A tu ritmo")}</strong><span>Duración</span></div><div class="stat progressRing"><strong>${s.percent}%</strong><span>${s.learned} / ${s.totalSongs}</span></div></div></div></section><h2 class="sectionTitle">Etapas</h2><section class="stages">${p.stages.length?p.stages.map((st,i)=>{const x=FortissimoPathProgress.stageState(p.id,st,p.stages),unlocked=FortissimoPathProgress.isUnlocked(p.id,i,p.stages),done=x.completed,current=!done&&i===s.current-1,cl=done?"done":current?"current":unlocked?"":"locked",symbol=done?"✓":unlocked?"":"🔒";return`<a class="stage ${cl}" ${unlocked?`href="study-stage.html?id=${encodeURIComponent(p.id)}&stage=${i+1}"`:'href="#" aria-disabled="true"'}><span class="dot">${symbol}</span><div><h3>${String(i+1).padStart(2,"0")}. ${esc(st.title)}</h3><div class="songs">${esc(st.a.artist)} - ${esc(st.a.title)} / ${esc(st.b.artist)} - ${esc(st.b.title)}</div></div><span class="chev">›</span></a>`}).join(""):`<div class="empty">Esta ruta todavía no tiene etapas.<br><a href="study-project-edit.html?id=${encodeURIComponent(p.id)}" style="color:#ff9d59">Construir ruta</a></div>`}</section>`;root.querySelectorAll('[aria-disabled="true"]').forEach(a=>a.onclick=e=>e.preventDefault())}render();window.addEventListener("fortissimo:path-progress",render);
