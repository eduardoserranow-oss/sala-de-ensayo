px}.shell{padding-top:40px}}</style></head><body><header class="topbar fortissimo-app-header"><a href="study-projects.html">← Proyectos</a><a href="index.html?internal=1&return=studypaths" style="justify-self:center"><img class="logo" src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO" /></a><span></span></header><main class="shell" id="root"></main><script src="assets/study-projects-v1.js?v=phase5"></script><script>const id=new URLSearchParams(location.search).get("id"),project=FortissimoProjects.get(id),root=document.getElementById("root");if(!project||project.archived){root.innerHTML='<p class="eyebrow">Study Paths</p><h1>Proyecto no disponible</h1><div class="actions"><a class="button primary" href="study-projects.html">Volver a proyectos</a></div>'}else{document.title=`${project.name} | FORTISSIMO`;root.innerHTML=`<p class="eyebrow">${project.instrument} · Study Path</p><h1>${project.name}</h1><p class="objective">${project.objective}</p><section class="empty"><h2>Tu proyecto está listo</h2><p>En la Fase 6 podrás construir sus etapas, agregar las canciones A/B y ordenar el recorrido completo.</p><div class="actions"><a class="button primary" href="study-projects.html?edit=${project.id}">Editar proyecto</a><a class="button" href="study-projects.html">Todos los proyectos</a></div></section>`}</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
