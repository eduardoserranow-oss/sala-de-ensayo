<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitar Notes | FORTISSIMO</title>
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/svg+xml" href="assets/fortissimo-icon-20260824.svg?v=fortissimo-icon8">
<style>
:root{--orange:#ff5a00;--bg:#050505;--muted:rgba(255,255,255,.58);--line:rgba(255,255,255,.13);--red:#ff4d4d;--green:#63e69a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh}
header{position:sticky;top:0;z-index:20;height:74px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:10px max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,#050505 58%,rgba(5,5,5,.88));backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)}
.back{color:#fff;text-decoration:none;font-size:38px;line-height:1;text-align:center}
.logo{height:34px;max-width:58vw;justify-self:center;object-fit:contain}
main{min-height:calc(100svh - 74px);display:flex;justify-content:center;padding:18px 18px max(28px,env(safe-area-inset-bottom))}
.exercise{width:min(560px,100%);display:flex;flex-direction:column;min-height:calc(100svh - 110px)}
.topline{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:4px 0 14px}
.progress{height:5px;background:#1a1a1a;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:#fff;width:0;transition:width .25s ease}
.counter{font-size:13px;color:rgba(255,255,255,.68);font-weight:800}
.kicker{text-align:center;font-size:12px;color:rgba(255,255,255,.56);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.prompt{text-align:center;font-size:18px;font-weight:700;margin:4px 0 0}
.note-wrap{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px 0 12px}
.note-circle{width:min(64vw,292px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,70,70,.72);background:radial-gradient(circle at 45% 42%,rgba(255,73,73,.26),rgba(115,9,9,.16) 48%,rgba(30,0,0,.08) 74%);box-shadow:0 0 42px rgba(255,44,44,.12),inset 0 0 45px rgba(255,44,44,.10);transition:.18s ease}
.note-circle.good{border-color:rgba(99,230,154,.95);box-shadow:0 0 50px rgba(99,230,154,.20),inset 0 0 45px rgba(99,230,154,.11)}
.note-circle.bad{animation:shake .22s linear 1;border-color:rgba(255,77,77,.98);box-shadow:0 0 54px rgba(255,77,77,.20)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.note{font-size:clamp(112px,28vw,176px);font-weight:900;line-height:.8;letter-spacing:-.08em}
.string-title{margin-top:20px;color:rgba(255,255,255,.54);font-size:13px;font-weight:800}
.strings{display:flex;gap:12px;justify-content:center;margin-top:12px}
.string{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.17);color:rgba(255,255,255,.45);font-size:13px;font-weight:900;background:#0b0b0b;position:relative}
.string::after{content:"";position:absolute;width:2px;height:16px;top:33px;background:rgba(255,255,255,.12)}
.string.active{background:#fff;color:#050505;border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.10)}
.feedback{min-height:44px;text-align:center;margin:22px 0 12px;color:var(--muted);font-size:14px;font-weight:750;line-height:1.35}
.feedback.good{color:var(--green)}
.feedback.bad{color:#ff8f8f}
.action{width:100%;height:56px;border:0;border-radius:14px;background:#d84040;color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(216,64,64,.18)}
.action:active{transform:translateY(1px)}
.statusline{min-height:22px;text-align:center;margin-top:10px;color:rgba(255,255,255,.38);font-size:11px}
.secondary-row{display:flex;justify-content:center;margin-top:8px}
.skip{border:0;background:transparent;color:rgba(255,255,255,.42);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 12px}
@media(min-width:800px){main{padding-top:28px}.exercise{min-height:calc(100vh - 130px)}.note-circle{width:300px}.strings{gap:16px}}
</style>
</head>
<body>
<header>
<a class="back" href="sound-gym.html?return=guitar-notes&internal=1" aria-label="Volver a Sound Gym">‹</a>
<img class="logo" src="assets/fortissimo-header-logo-v6.jpg?v=fortissimo-header7" alt="FORTISSIMO">
<span></span>
</header>

<main>
<section class="exercise" aria-live="polite">
  <div class="topline">
    <div class="progress"><span id="progressFill"></span></div>
    <div class="counter" id="counter">1</div>
  </div>
  <div class="kicker">Guitar Notes</div>
  <div class="prompt">Toca la nota en la cuerda indicada</div>

  <div class="note-wrap">
    <div class="note-circle" id="noteCircle"><div class="note" id="note">C</div></div>
    <div class="string-title" id="stringTitle">Cuerda 1</div>
    <div class="strings" id="strings"></div>
  </div>

  <div class="feedback" id="feedback">Activa el micrófono para comenzar.</div>
  <button class="action" id="mainButton" type="button">ACTIVAR MICRÓFONO</button>
  <div class="secondary-row"><button class="skip" id="skip" type="button">No la sé / siguiente</button></div>
  <div class="statusline" id="statusline">El micrófono está apagado.</div>
</section>
</main>

<script>
(() => {
  "use strict";

  const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const STORE = "fortissimo.guitarNotes.v3";
  const OLD_STORE = "fortissimo.guitarNotes.v2";
  const LAST_WORLD = "fortissimo.soundGym.lastWorld.v1";

  const STABLE_CORRECT_MS = 260;
  const STABLE_WRONG_MS = 440;
  const CENT_TOLERANCE = 45;
  const MIN_RMS = 0.0075;
  const NEXT_DELAY_MS = 650;

  const freshState = () => ({
    stats: {},
    total: 0,
    correct: 0,
    round: 0,
    recent: []
  });

  let state = freshState();
  try {
    const saved = localStorage.getItem(STORE) || localStorage.getItem(OLD_STORE);
    if (saved) state = {...state, ...JSON.parse(saved)};
    state.stats = state.stats || {};
    state.recent = state.recent || [];
  } catch (_) {}

  try { sessionStorage.setItem(LAST_WORLD, "guitar-notes"); } catch (_) {}

  const noteEl = document.getElementById("note");
  const noteCircle = document.getElementById("noteCircle");
  const stringTitle = document.getElementById("stringTitle");
  const stringsEl = document.getElementById("strings");
  const feedback = document.getElementById("feedback");
  const button = document.getElementById("mainButton");
  const skipButton = document.getElementById("skip");
  const statusline = document.getElementById("statusline");
  const counter = document.getElementById("counter");
  const progressFill = document.getElementById("progressFill");

  for (let s = 1; s <= 6; s++) {
    const el = document.createElement("div");
    el.className = "string";
    el.textContent = s;
    el.setAttribute("aria-label", "Cuerda " + s);
    stringsEl.appendChild(el);
  }

  let target = null;
  let targetStartedAt = 0;
  let audioContext = null;
  let analyser = null;
  let micSource = null;
  let stream = null;
  let sampleBuffer = null;
  let rafId = 0;
  let running = false;
  let locked = false;

  let candidateMidi = null;
  let candidateSince = 0;
  let lastWrongKey = "";
  let lastWrongAt = 0;

  function key(note, stringNumber) {
    return stringNumber + "-" + note;
  }

  function getStat(note, stringNumber) {
    return state.stats[key(note, stringNumber)] || {
      ok: 0,
      bad: 0,
      avgMs: 0,
      last: 0
    };
  }

  function mastery(stat) {
    const attempts = stat.ok + stat.bad;
    if (!attempts) return 0;
    const acc = stat.ok / attempts;
    const speed = stat.avgMs ? Math.max(0, Math.min(1, 1 - Math.max(0, stat.avgMs - 1200) / 5500)) : 0;
    const reps = Math.min(1, stat.ok / 5);
    return acc * .5 + speed * .25 + reps * .25;
  }

  function weight(note, stringNumber) {
    const stat = getStat(note, stringNumber);
    const attempts = stat.ok + stat.bad;
    const m = mastery(stat);
    const unseen = attempts === 0 ? 2.4 : 0;
    const misses = stat.bad * .25;
    const weak = (1 - m) * 4.5;
    const slow = stat.avgMs ? Math.min(2, Math.max(0, (stat.avgMs - 1800) / 2600)) : .8;
    const age = stat.last ? Math.min(1.4, (Date.now() - stat.last) / 86400000 * .18) : 1;
    return Math.max(.25, .5 + unseen + misses + weak + slow + age);
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (_) {}
  }

  function pickTarget() {
    const prev = target ? key(target.note, target.stringNumber) : "";
    const recent = new Set((state.recent || []).slice(-5));
    const pool = [];

    for (let stringNumber = 1; stringNumber <= 6; stringNumber++) {
      for (const note of NOTES) {
        const k = key(note, stringNumber);
        let w = weight(note, stringNumber);
        if (k === prev) w *= .08;
        else if (recent.has(k)) w *= .45;
        pool.push({note, stringNumber, k, w});
      }
    }

    const sum = pool.reduce((a, x) => a + x.w, 0);
    let r = Math.random() * sum;
    target = pool[pool.length - 1];

    for (const item of pool) {
      r -= item.w;
      if (r <= 0) {
        target = item;
        break;
      }
    }

    state.round = (state.round || 0) + 1;
    state.recent = [...(state.recent || []), target.k].slice(-10);
    targetStartedAt = performance.now();
    candidateMidi = null;
    candidateSince = 0;
    locked = false;
    lastWrongKey = "";
    save();
    renderTarget();
  }

  function renderTarget() {
    noteEl.textContent = target.note;
    stringTitle.textContent = "Cuerda " + target.stringNumber;
    counter.textContent = String(state.round);
    const progress = ((state.round - 1) % 10 + 1) * 10;
    progressFill.style.width = progress + "%";
    [...stringsEl.children].forEach((el, i) => el.classList.toggle("active", i === target.stringNumber - 1));
    noteCircle.classList.remove("good", "bad");
    feedback.className = "feedback";
    feedback.textContent = running ? "Escuchando…" : "Activa el micrófono para comenzar.";
    button.textContent = running ? "NEXT" : "ACTIVAR MICRÓFONO";
    statusline.textContent = running ? "Micrófono activo · toca una nota." : "El micrófono está apagado.";
  }

  async function ensureAudioContext() {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) throw new Error("Web Audio no está disponible en este navegador.");
    if (!audioContext) audioContext = new Ctor({latencyHint: "interactive"});
    if (audioContext.state !== "running") await audioContext.resume();
    return audioContext;
  }

  async function startAudioEngine() {
    if (running) return;

    button.disabled = true;
    button.textContent = "ACTIVANDO…";
    feedback.className = "feedback";
    feedback.textContent = "Solicitando acceso al micrófono…";
    statusline.textContent = "Inicializando motor de audio…";

    try {
      await ensureAudioContext();

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("El navegador no expone getUserMedia.");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          channelCount: 1
        },
        video: false
      });

      const track = stream.getAudioTracks()[0];
      if (!track) throw new Error("No se recibió ninguna pista de audio.");

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      analyser.minDecibels = -100;
      analyser.maxDecibels = -10;

      micSource = audioContext.createMediaStreamSource(stream);
      micSource.connect(analyser);
      sampleBuffer = new Float32Array(analyser.fftSize);

      running = true;
      button.disabled = false;
      button.textContent = "NEXT";
      feedback.textContent = "Escuchando… toca " + target.note;
      statusline.textContent = "Micrófono activo · " + (track.label || "entrada de audio");
      detectLoop();
    } catch (err) {
      console.error("[Guitar Notes] Audio engine failed:", err);
      running = false;
      button.disabled = false;
      button.textContent = "REINTENTAR MICRÓFONO";
      feedback.className = "feedback bad";
      feedback.textContent = "No pude iniciar el micrófono.";
      statusline.textContent = String(err && err.message ? err.message : err);
    }
  }

  function rmsOf(buffer) {
    let sum = 0;
    for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
    return Math.sqrt(sum / buffer.length);
  }

  function estimatePitch(buffer, sampleRate) {
    const rms = rmsOf(buffer);
    if (rms < MIN_RMS) return null;

    const minFreq = 70;
    const maxFreq = 1200;
    const minLag = Math.floor(sampleRate / maxFreq);
    const maxLag = Math.min(Math.floor(sampleRate / minFreq), buffer.length - 2);

    let bestLag = -1;
    let bestCorr = 0;

    for (let lag = minLag; lag <= maxLag; lag++) {
      let corr = 0;
      let energyA = 0;
      let energyB = 0;
      const limit = buffer.length - lag;

      for (let i = 0; i < limit; i++) {
        const a = buffer[i];
        const b = buffer[i + lag];
        corr += a * b;
        energyA += a * a;
        energyB += b * b;
      }

      const denom = Math.sqrt(energyA * energyB) || 1;
      const norm = corr / denom;
      if (norm > bestCorr) {
        bestCorr = norm;
        bestLag = lag;
      }
    }

    if (bestLag < 0 || bestCorr < .68) return null;

    let refinedLag = bestLag;
    if (bestLag > minLag && bestLag < maxLag) {
      const corrAt = (lag) => {
        let corr = 0, ea = 0, eb = 0;
        const limit = buffer.length - lag;
        for (let i = 0; i < limit; i++) {
          const a = buffer[i], b = buffer[i + lag];
          corr += a * b; ea += a * a; eb += b * b;
        }
        return corr / (Math.sqrt(ea * eb) || 1);
      };
      const y1 = corrAt(bestLag - 1);
      const y2 = bestCorr;
      const y3 = corrAt(bestLag + 1);
      const denom = (y1 - 2 * y2 + y3);
      if (Math.abs(denom) > 1e-6) refinedLag = bestLag + .5 * (y1 - y3) / denom;
    }

    const freq = sampleRate / refinedLag;
    if (!Number.isFinite(freq) || freq < minFreq || freq > maxFreq) return null;

    const midiFloat = 69 + 12 * Math.log2(freq / 440);
    const midi = Math.round(midiFloat);
    const cents = (midiFloat - midi) * 100;
    const noteName = NOTES[((midi % 12) + 12) % 12];

    return {freq, midi, cents, noteName, confidence: bestCorr, rms};
  }

  function playCorrectSound() {
    playToneSequence([
      {f: 659.25, t: 0, d: .10, g: .11},
      {f: 783.99, t: .07, d: .12, g: .10},
      {f: 1046.50, t: .14, d: .16, g: .09}
    ]);
  }

  function playWrongSound() {
    playToneSequence([
      {f: 220, t: 0, d: .13, g: .12},
      {f: 174.61, t: .10, d: .18, g: .10}
    ]);
  }

  async function playToneSequence(items) {
    try {
      const ctx = await ensureAudioContext();
      const master = ctx.createGain();
      master.gain.value = .9;
      master.connect(ctx.destination);
      const now = ctx.currentTime;

      items.forEach(item => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(item.f, now + item.t);
        gain.gain.setValueAtTime(.0001, now + item.t);
        gain.gain.exponentialRampToValueAtTime(item.g, now + item.t + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, now + item.t + item.d);
        osc.connect(gain).connect(master);
        osc.start(now + item.t);
        osc.stop(now + item.t + item.d + .02);
      });

      setTimeout(() => { try { master.disconnect(); } catch (_) {} }, 700);
    } catch (e) {
      console.warn("[Guitar Notes] feedback tone failed", e);
    }
  }

  function markWrong(heard) {
    if (!target || locked) return;
    const now = performance.now();
    const wrongKey = target.k + "|" + heard;

    if (lastWrongKey === wrongKey && now - lastWrongAt < 900) return;
    lastWrongKey = wrongKey;
    lastWrongAt = now;

    const stat = getStat(target.note, target.stringNumber);
    stat.bad++;
    stat.last = Date.now();
    state.stats[target.k] = stat;
    state.total++;
    save();

    noteCircle.classList.remove("bad");
    void noteCircle.offsetWidth;
    noteCircle.classList.add("bad");
    feedback.className = "feedback bad";
    feedback.textContent = "No · escuché " + heard + ". Busca " + target.note + ".";
    playWrongSound();

    candidateMidi = null;
    candidateSince = 0;
    setTimeout(() => noteCircle.classList.remove("bad"), 420);
  }

  function markCorrect() {
    if (!target || locked) return;
    locked = true;

    const ms = Math.max(250, Math.round(performance.now() - targetStartedAt));
    const stat = getStat(target.note, target.stringNumber);
    stat.ok++;
    stat.last = Date.now();
    stat.avgMs = stat.avgMs ? Math.round(stat.avgMs * .72 + ms * .28) : ms;
    state.stats[target.k] = stat;
    state.total++;
    state.correct++;
    save();

    noteCircle.classList.add("good");
    feedback.className = "feedback good";
    feedback.textContent = "Correcto";
    statusline.textContent = "✓ " + target.note + " detectada";
    playCorrectSound();

    setTimeout(pickTarget, NEXT_DELAY_MS);
  }

  function processPitch(pitch) {
    if (!pitch || !target || locked) {
      candidateMidi = null;
      candidateSince = 0;
      return;
    }

    const now = performance.now();
    const inTune = Math.abs(pitch.cents) <= CENT_TOLERANCE;

    if (candidateMidi !== pitch.midi || !inTune) {
      candidateMidi = pitch.midi;
      candidateSince = now;
      return;
    }

    const stableFor = now - candidateSince;
    const correctPitchClass = pitch.noteName === target.note;

    statusline.textContent =
      "Escucho " + pitch.noteName +
      " · " + pitch.freq.toFixed(1) + " Hz" +
      " · " + (pitch.cents >= 0 ? "+" : "") + pitch.cents.toFixed(0) + "¢";

    if (correctPitchClass && stableFor >= STABLE_CORRECT_MS) {
      markCorrect();
    } else if (!correctPitchClass && stableFor >= STABLE_WRONG_MS) {
      markWrong(pitch.noteName);
    }
  }

  function detectLoop() {
    if (!running || !analyser || !sampleBuffer) return;

    analyser.getFloatTimeDomainData(sampleBuffer);
    const pitch = estimatePitch(sampleBuffer, audioContext.sampleRate);

    if (pitch) {
      processPitch(pitch);
    } else {
      candidateMidi = null;
      candidateSince = 0;
      if (!locked) statusline.textContent = "Micrófono activo · esperando una nota clara…";
    }

    rafId = requestAnimationFrame(detectLoop);
  }

  button.addEventListener("click", async () => {
    if (!running) {
      await startAudioEngine();
      return;
    }
    pickTarget();
  });

  skipButton.addEventListener("click", () => {
    if (target) {
      const stat = getStat(target.note, target.stringNumber);
      stat.bad++;
      stat.last = Date.now();
      state.stats[target.k] = stat;
      state.total++;
      save();
    }
    pickTarget();
  });

  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && running && audioContext && audioContext.state !== "running") {
      try { await audioContext.resume(); } catch (_) {}
    }
  });

  window.addEventListener("beforeunload", () => {
    if (rafId) cancelAnimationFrame(rafId);
    try { stream && stream.getTracks().forEach(t => t.stop()); } catch (_) {}
  });

  pickTarget();
})();
</script>
</body>
</html>
