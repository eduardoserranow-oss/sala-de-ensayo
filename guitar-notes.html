<!doctype html>

<head>

<style>
:root{--red:#d84040;--green:#63e69a;--muted:rgba(255,255,255,.58)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh}.sg-header{position:sticky;top:0;z-index:20;height:74px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:10px max(14px,env(safe-area-inset-left));background:linear-gradient(180deg,#050505 58%,rgba(5,5,5,.88));backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)}.back{color:#fff;text-decoration:none;font-size:38px;line-height:1;text-align:center}.logo{height:34px;max-width:58vw;justify-self:center;object-fit:contain}main{min-height:calc(100svh - 74px);display:flex;justify-content:center;padding:18px 18px max(28px,env(safe-area-inset-bottom))}.exercise{width:min(560px,100%);display:flex;flex-direction:column;min-height:calc(100svh - 110px)}.topline{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:4px 0 14px}.progress{height:5px;background:#1a1a1a;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:#fff;width:0;transition:width .25s}.counter{font-size:13px;color:#aaa;font-weight:800}.kicker{text-align:center;font-size:12px;color:#929292;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.prompt{text-align:center;font-size:18px;font-weight:700;margin:4px 0 0}.note-wrap{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:18px 0 12px}.note-circle{width:min(64vw,292px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,70,70,.72);background:radial-gradient(circle at 45% 42%,rgba(255,73,73,.26),rgba(115,9,9,.16) 48%,rgba(30,0,0,.08) 74%);box-shadow:0 0 42px rgba(255,44,44,.12),inset 0 0 45px rgba(255,44,44,.10);transition:.18s}.note-circle.good{border-color:var(--green);box-shadow:0 0 50px rgba(99,230,154,.20),inset 0 0 45px rgba(99,230,154,.11)}.note-circle.bad{animation:shake .22s linear;border-color:#ff4d4d}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.note{font-size:clamp(112px,28vw,176px);font-weight:900;line-height:.8;letter-spacing:-.08em}.string-title{margin-top:20px;color:#8d8d8d;font-size:13px;font-weight:800}.strings{display:flex;gap:12px;justify-content:center;margin-top:12px}.string{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid #343434;color:#777;font-size:13px;font-weight:900;background:#0b0b0b;position:relative}.string:after{content:"";position:absolute;width:2px;height:16px;top:33px;background:#242424}.string.active{background:#fff;color:#050505;border-color:#fff}.feedback{min-height:44px;text-align:center;margin:22px 0 12px;color:var(--muted);font-size:14px;font-weight:750;line-height:1.35}.feedback.good{color:var(--green)}.feedback.bad{color:#ff8f8f}.action{width:100%;height:56px;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.action:disabled{opacity:.55}.statusline{min-height:22px;text-align:center;margin-top:10px;color:#747474;font-size:11px}.secondary-row{display:flex;justify-content:center;margin-top:8px}.skip{border:0;background:transparent;color:#757575;font-size:12px;text-decoration:underline;cursor:pointer;padding:6px 12px}@media(min-width:800px){main{padding-top:28px}.exercise{min-height:calc(100vh - 130px)}.note-circle{width:300px}.strings{gap:16px}}
</style>
</head>
<body>
<header class="sg-header"><a class="back" href="sound-gym.html?return=guitar-notes&internal=1" aria-label="Volver a Sound Gym">‹</a><img class="logo" src="assets/fortissimo-header-logo-v6.jpg?v=fortissimo-header7" alt="FORTISSIMO"><span></span></header>
<main><section class="exercise" aria-live="polite">
<div class="topline"><div class="progress"><span id="progressFill"></span></div><div class="counter" id="counter">1</div></div>
<div class="kicker">Guitar Notes</div><div class="prompt">Toca la nota en la cuerda indicada</div>
<div class="note-wrap"><div class="note-circle" id="noteCircle"><div class="note" id="note">C</div></div><div class="string-title" id="stringTitle">Cuerda 1</div><div class="strings" id="strings"></div></div>
<div class="feedback" id="feedback">Activa el micrófono para comenzar.</div>
<button class="action" id="mainButton" type="button">ACTIVAR MICRÓFONO</button>
<div class="secondary-row"><button class="skip" id="skip" type="button">No la sé / siguiente</button></div>
<div class="statusline" id="statusline">El micrófono está apagado.</div>
</section></main>
<script>
(()=>{"use strict";
const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],STORE="fortissimo.guitarNotes.v3",OLD_STORE="fortissimo.guitarNotes.v2",LAST_WORLD="fortissimo.soundGym.lastWorld.v1";
const STABLE_CORRECT_MS=260,STABLE_WRONG_MS=440,CENT_TOLERANCE=45,MIN_RMS=.0075,NEXT_DELAY_MS=650,MIC_GAIN_DB=10,MIC_GAIN_LINEAR=Math.pow(10,MIC_GAIN_DB/20);
const fresh=()=>({stats:{},total:0,correct:0,round:0,recent:[]});let state=fresh();try{const saved=localStorage.getItem(STORE)||localStorage.getItem(OLD_STORE);if(saved)state={...state,...JSON.parse(saved)};state.stats=state.stats||{};state.recent=state.recent||[]}catch(_){}try{sessionStorage.setItem(LAST_WORLD,"guitar-notes")}catch(_){}
const $=id=>document.getElementById(id),noteEl=$("note"),circle=$("noteCircle"),stringTitle=$("stringTitle"),stringsEl=$("strings"),feedback=$("feedback"),button=$("mainButton"),skip=$("skip"),status=$("statusline"),counter=$("counter"),progress=$("progressFill");for(let s=1;s<=6;s++){const el=document.createElement("div");el.className="string";el.textContent=s;stringsEl.appendChild(el)}
let target=null,targetStarted=0,ctx=null,analyser=null,source=null,inputGain=null,stream=null,buffer=null,raf=0,running=false,locked=false,candidateMidi=null,candidateSince=0,lastWrongKey="",lastWrongAt=0;
const key=(n,s)=>s+"-"+n;function statFor(n,s){return state.stats[key(n,s)]||{ok:0,bad:0,avgMs:0,last:0}}function mastery(x){const a=x.ok+x.bad;if(!a)return 0;const acc=x.ok/a,speed=x.avgMs?Math.max(0,Math.min(1,1-Math.max(0,x.avgMs-1200)/5500)):0,reps=Math.min(1,x.ok/5);return acc*.5+speed*.25+reps*.25}function weight(n,s){const x=statFor(n,s),a=x.ok+x.bad,m=mastery(x);return Math.max(.25,.5+(a===0?2.4:0)+x.bad*.25+(1-m)*4.5+(x.avgMs?Math.min(2,Math.max(0,(x.avgMs-1800)/2600)):.8)+(x.last?Math.min(1.4,(Date.now()-x.last)/86400000*.18):1))}function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(_){}}
function pick(){const prev=target?key(target.note,target.stringNumber):"",recent=new Set(state.recent.slice(-5)),pool=[];for(let s=1;s<=6;s++)for(const note of NOTES){const k=key(note,s);let w=weight(note,s);if(k===prev)w*=.08;else if(recent.has(k))w*=.45;pool.push({note,stringNumber:s,k,w})}let r=Math.random()*pool.reduce((a,x)=>a+x.w,0);target=pool[pool.length-1];for(const x of pool){r-=x.w;if(r<=0){target=x;break}}state.round++;state.recent=[...state.recent,target.k].slice(-10);targetStarted=performance.now();candidateMidi=null;candidateSince=0;locked=false;lastWrongKey="";save();render()}
function render(){noteEl.textContent=target.note;stringTitle.textContent="Cuerda "+target.stringNumber;counter.textContent=state.round;progress.style.width=Math.min(100,(state.round%20)/20*100)+"%";[...stringsEl.children].forEach((e,i)=>e.classList.toggle("active",i===target.stringNumber-1));circle.classList.remove("good","bad");feedback.className="feedback";feedback.textContent=running?"Escuchando…":"Activa el micrófono para comenzar.";button.textContent=running?"NEXT":"ACTIVAR MICRÓFONO";status.textContent=running?"Micrófono activo · +10 dB · toca una nota.":"El micrófono está apagado."}
async function ensureCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error("Web Audio no está disponible.");if(!ctx)ctx=new C({latencyHint:"interactive"});if(ctx.state!=="running")await ctx.resume();return ctx}
async function start(){if(running)return;button.disabled=true;button.textContent="ACTIVANDO…";feedback.textContent="Solicitando acceso al micrófono…";status.textContent="Inicializando motor de audio…";try{await ensureCtx();if(!navigator.mediaDevices?.getUserMedia)throw new Error("getUserMedia no está disponible.");stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1},video:false});const track=stream.getAudioTracks()[0];if(!track)throw new Error("No se recibió pista de audio.");analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;analyser.minDecibels=-100;analyser.maxDecibels=-10;source=ctx.createMediaStreamSource(stream);inputGain=ctx.createGain();inputGain.gain.value=MIC_GAIN_LINEAR;source.connect(inputGain);inputGain.connect(analyser);buffer=new Float32Array(analyser.fftSize);running=true;button.disabled=false;button.textContent="NEXT";feedback.textContent="Escuchando… toca "+target.note;status.textContent="Micrófono activo · +10 dB · "+(track.label||"entrada de audio");loop()}catch(err){console.error("[Guitar Notes]",err);running=false;button.disabled=false;button.textContent="REINTENTAR MICRÓFONO";feedback.className="feedback bad";feedback.textContent="No pude iniciar el micrófono.";status.textContent=err?.message||String(err)}}
function rms(b){let sum=0;for(let i=0;i<b.length;i++)sum+=b[i]*b[i];return Math.sqrt(sum/b.length)}function pitch(b,sr){const level=rms(b);if(level<MIN_RMS)return null;const minLag=Math.floor(sr/1200),maxLag=Math.min(Math.floor(sr/70),b.length-2);let best=-1,bestCorr=0;for(let lag=minLag;lag<=maxLag;lag++){let c=0,ea=0,eb=0,lim=b.length-lag;for(let i=0;i<lim;i++){const a=b[i],d=b[i+lag];c+=a*d;ea+=a*a;eb+=d*d}const n=c/(Math.sqrt(ea*eb)||1);if(n>bestCorr){bestCorr=n;best=lag}}if(best<0||bestCorr<.68)return null;const f=sr/best;if(!Number.isFinite(f)||f<70||f>1200)return null;const mf=69+12*Math.log2(f/440),m=Math.round(mf),c=(mf-m)*100;return{freq:f,midi:m,cents:c,noteName:NOTES[((m%12)+12)%12]}}
function tones(items){ensureCtx().then(c=>{const master=c.createGain();master.gain.value=.9;master.connect(c.destination);const now=c.currentTime;items.forEach(x=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=x.f;g.gain.setValueAtTime(.0001,now+x.t);g.gain.exponentialRampToValueAtTime(x.g,now+x.t+.012);g.gain.exponentialRampToValueAtTime(.0001,now+x.t+x.d);o.connect(g).connect(master);o.start(now+x.t);o.stop(now+x.t+x.d+.02)});setTimeout(()=>{try{master.disconnect()}catch(_){}},700)}).catch(()=>{})}const goodTone=()=>tones([{f:659.25,t:0,d:.10,g:.11},{f:783.99,t:.07,d:.12,g:.10},{f:1046.5,t:.14,d:.16,g:.09}]),badTone=()=>tones([{f:220,t:0,d:.13,g:.12},{f:174.61,t:.10,d:.18,g:.10}]);
function wrong(heard){if(!target||locked)return;const now=performance.now(),wk=target.k+"|"+heard;if(lastWrongKey===wk&&now-lastWrongAt<900)return;lastWrongKey=wk;lastWrongAt=now;const x=statFor(target.note,target.stringNumber);x.bad++;x.last=Date.now();state.stats[target.k]=x;state.total++;save();circle.classList.remove("bad");void circle.offsetWidth;circle.classList.add("bad");feedback.className="feedback bad";feedback.textContent="No · escuché "+heard+". Busca "+target.note+".";badTone();candidateMidi=null;candidateSince=0;setTimeout(()=>circle.classList.remove("bad"),420)}function correct(){if(!target||locked)return;locked=true;const ms=Math.max(250,Math.round(performance.now()-targetStarted)),x=statFor(target.note,target.stringNumber);x.ok++;x.last=Date.now();x.avgMs=x.avgMs?Math.round(x.avgMs*.72+ms*.28):ms;state.stats[target.k]=x;state.total++;state.correct++;save();circle.classList.add("good");feedback.className="feedback good";feedback.textContent="Correcto";status.textContent="✓ "+target.note+" detectada";goodTone();setTimeout(pick,NEXT_DELAY_MS)}
function process(p){if(!p||!target||locked){candidateMidi=null;candidateSince=0;return}const now=performance.now(),tuned=Math.abs(p.cents)<=CENT_TOLERANCE;if(candidateMidi!==p.midi||!tuned){candidateMidi=p.midi;candidateSince=now;return}const stable=now-candidateSince;status.textContent="Escucho "+p.noteName+" · "+p.freq.toFixed(1)+" Hz · "+(p.cents>=0?"+":"")+p.cents.toFixed(0)+"¢";if(p.noteName===target.note&&stable>=STABLE_CORRECT_MS)correct();else if(p.noteName!==target.note&&stable>=STABLE_WRONG_MS)wrong(p.noteName)}function loop(){if(!running||!analyser||!buffer)return;analyser.getFloatTimeDomainData(buffer);const p=pitch(buffer,ctx.sampleRate);if(p)process(p);else{candidateMidi=null;candidateSince=0;if(!locked)status.textContent="Micrófono activo · +10 dB · esperando una nota clara…"}raf=requestAnimationFrame(loop)}
button.addEventListener("click",async()=>{if(!running)await start();else pick()});skip.addEventListener("click",()=>{if(target){const x=statFor(target.note,target.stringNumber);x.bad++;x.last=Date.now();state.stats[target.k]=x;state.total++;save()}pick()});document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&running&&ctx?.state!=="running")try{await ctx.resume()}catch(_){}});window.addEventListener("beforeunload",()=>{if(raf)cancelAnimationFrame(raf);try{stream?.getTracks().forEach(t=>t.stop())}catch(_){}});pick();
})();
</script>
