<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitar Notes | FORTISSIMO</title><meta name="theme-color" content="#050505">
<style>
:root{--red:#ff2538;--red2:#ff4656;--green:#45e08d;--muted:rgba(255,255,255,.46)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;overflow-x:hidden}.app{width:min(560px,100%);min-height:100svh;margin:auto;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 34%,rgba(255,37,56,.055),transparent 28%),#050505}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px}.back{color:#fff;text-decoration:none;font-size:34px;line-height:1;text-align:left}.count{font-size:11px;font-weight:850;text-align:right;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}.progress{height:3px;border-radius:999px;background:rgba(255,255,255,.11);overflow:hidden}.progress span{display:block;height:100%;width:4%;background:var(--red);box-shadow:0 0 12px rgba(255,37,56,.85);transition:width .25s ease}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 16px;min-height:0}.ring-wrap{position:relative;width:min(66vw,300px);max-width:300px;aspect-ratio:1;margin:4vh 0 34px}.ring,.ring::before,.ring::after{position:absolute;border-radius:50%;content:""}.ring{inset:9%;display:grid;place-items:center;border:2px solid rgba(255,58,74,.88);background:radial-gradient(circle,rgba(255,44,61,.08),rgba(10,5,6,.96) 58%);box-shadow:0 0 0 8px rgba(255,37,56,.075),0 0 26px rgba(255,37,56,.42),inset 0 0 24px rgba(255,37,56,.1);transition:.18s ease}.ring::before{inset:-9%;border:1px solid rgba(255,37,56,.3);box-shadow:0 0 25px rgba(255,37,56,.18)}.ring::after{inset:7%;border:1px solid rgba(255,255,255,.055)}.ring.good{border-color:var(--green);box-shadow:0 0 0 8px rgba(69,224,141,.08),0 0 34px rgba(69,224,141,.55),inset 0 0 24px rgba(69,224,141,.12)}.ring.bad{animation:badPulse .28s ease 2}.note{position:relative;z-index:2;font-size:clamp(64px,18vw,104px);font-weight:750;letter-spacing:-.055em;line-height:1}.heard{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}.heard.good{color:var(--green)}.heard.bad{color:#ff7d89}
.strings{width:min(390px,100%);display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px}.string{text-align:center}.dot{width:34px;height:34px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.26);color:rgba(255,255,255,.72);font-size:11px;font-weight:850;background:#090909;transition:.18s ease}.string.active .dot{border-color:var(--red2);background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,37,56,.42)}.tuning{margin-top:5px;color:rgba(255,255,255,.3);font-size:8px;font-weight:850}.status{min-height:18px;margin:8px 0 4px;color:rgba(255,255,255,.42);font-size:11px;text-align:center}.status.bad{color:#ff818d}.status.good{color:var(--green)}
.bottom{padding-top:14px}.next{width:100%;height:52px;border:0;border-radius:999px;background:#fff;color:#121212;font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 7px 28px rgba(0,0,0,.34)}.next:active{transform:scale(.985)}.subline{height:3px;width:34%;max-width:150px;margin:18px auto 0;border-radius:999px;background:rgba(255,255,255,.72)}
@keyframes badPulse{50%{transform:scale(.965);box-shadow:0 0 0 8px rgba(255,37,56,.13),0 0 42px rgba(255,37,56,.72),inset 0 0 25px rgba(255,37,56,.18)}}
@media(min-width:700px){.app{border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05)}.ring-wrap{width:310px}.strings{gap:16px}}
@media(max-height:700px){.stage{padding-top:8px}.ring-wrap{width:min(48vh,250px);margin:1vh 0 22px}.bottom{padding-top:6px}}
</style></head>
<body><main class="app">
<div class="top"><a class="back" href="sound-gym.html?return=guitar-notes&internal=1" aria-label="Volver a Sound Gym">‹</a><div class="progress"><span id="progressFill"></span></div><div class="count" id="count">1 / 25</div></div>
<section class="stage">
<div class="ring-wrap"><div class="ring" id="ring"><div class="note" id="note">C#</div></div><div class="heard" id="heard">GUITAR NOTES</div></div>
<div class="strings" id="strings"></div><div class="status" id="status">Toca Activar micrófono para comenzar</div>
</section>
<div class="bottom"><button class="next" id="next" type="button">Activar micrófono</button><div class="subline"></div></div>
</main>
<script>
(()=>{"use strict";
const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],TUNING=["E","B","G","D","A","E"];
const STORE="fortissimo.guitarNotes.v2",LEGACY="fortissimo.guitarNotes.v1",LAST_WORLD="fortissimo.soundGym.lastWorld.v1";
const STABLE_MS=330,WRONG_STABLE_MS=520,CENT_TOLERANCE=38,MIN_RMS=.016,SESSION=25;
const fresh=()=>({stats:{},total:0,correct:0,streak:0,times:[],round:0,recent:[]});let state=fresh();
try{state={...state,...JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(LEGACY)||"{}")};state.stats=state.stats||{};state.times=state.times||[];state.recent=state.recent||[]}catch(_){}try{sessionStorage.setItem(LAST_WORLD,"guitar-notes")}catch(_){}
let target=null,targetStarted=0,audio=null,analyser=null,buf=null,stream=null,running=false,locked=false,candidateMidi=null,candidateSince=0,wrongLatch=null,lastSignal=0,sfxContext=null;
const noteEl=document.getElementById("note"),ring=document.getElementById("ring"),heard=document.getElementById("heard"),status=document.getElementById("status"),strings=document.getElementById("strings"),next=document.getElementById("next"),count=document.getElementById("count"),progressFill=document.getElementById("progressFill");
TUNING.forEach((t,i)=>{const el=document.createElement("div");el.className="string";el.innerHTML=`<div class="dot">${i+1}</div><div class="tuning">${t}</div>`;strings.appendChild(el)});
function key(n,s){return s+"-"+n}function statFor(n,s){return state.stats[key(n,s)]||{ok:0,bad:0,ms:0,last:0,streak:0}}
function mastery(x){const a=x.ok+x.bad;if(!a)return 0;const acc=x.ok/a,speed=x.ms?Math.max(0,1-Math.max(0,x.ms-1200)/6000):0,reps=Math.min(1,x.ok/5);return Math.max(0,Math.min(1,acc*.48+speed*.27+reps*.25))}
function weight(n,s){const x=statFor(n,s),a=x.ok+x.bad,m=mastery(x),unseen=a===0?2.25:0,err=(1-m)*5.2+x.bad*.22,slow=x.ms?Math.min(2.3,Math.max(0,(x.ms-1700)/2600)):1,age=x.last?Math.min(1.8,(Date.now()-x.last)/86400000*.22):1.1;return Math.max(.35,.55+unseen+err+slow+age)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(_){}}
function choose(){const prev=target?.k||"",recent=new Set(state.recent.slice(-5)),pool=[];for(let s=1;s<=6;s++)for(const n of NOTES){const k=key(n,s);let w=weight(n,s);if(k===prev)w*=.08;else if(recent.has(k))w*=.45;pool.push({n,s,k,w})}let r=Math.random()*pool.reduce((a,x)=>a+x.w,0);target=pool.at(-1);for(const x of pool){r-=x.w;if(r<=0){target=x;break}}state.round++;state.recent=state.recent.concat(target.k).slice(-10);targetStarted=performance.now();locked=false;candidateMidi=null;candidateSince=0;wrongLatch=null;ring.classList.remove("good","bad");heard.className="heard";heard.textContent="GUITAR NOTES";status.className="status";status.textContent=running?"Escuchando…":"Micrófono apagado";noteEl.textContent=target.n;[...strings.children].forEach((el,i)=>el.classList.toggle("active",i===target.s-1));const rnum=((state.round-1)%SESSION)+1;count.textContent=`${rnum} / ${SESSION}`;progressFill.style.width=`${Math.max(4,rnum/SESSION*100)}%`;save()}
function addAttempt(ok){const x=statFor(target.n,target.s),ms=Math.max(250,Math.round(performance.now()-targetStarted));state.total++;x.last=Date.now();if(ok){state.correct++;state.streak++;x.ok++;x.streak=(x.streak||0)+1;x.ms=x.ms?Math.round(x.ms*.7+ms*.3):ms;state.times=state.times.concat(ms).slice(-50)}else{state.streak=0;x.bad++;x.streak=0}state.stats[target.k]=x;save()}
function getSfx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!sfxContext)sfxContext=new C();if(sfxContext.state==="suspended")sfxContext.resume();return sfxContext}
function tone(ctx,freq,start,dur,gain=.1,type="sine"){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g).connect(ctx.destination);o.start(start);o.stop(start+dur+.02)}
function playCorrectSound(){try{const c=getSfx(),n=c.currentTime;tone(c,523.25,n,.12,.09,"sine");tone(c,659.25,n+.09,.14,.08,"sine");tone(c,783.99,n+.18,.2,.07,"sine")}catch(_){}}
function playWrongSound(){try{const c=getSfx(),n=c.currentTime;tone(c,196,n,.16,.09,"square");tone(c,146.83,n+.09,.2,.065,"square")}catch(_){}}
function success(){if(locked)return;locked=true;addAttempt(true);playCorrectSound();ring.classList.add("good");heard.className="heard good";heard.textContent="CORRECTO";status.className="status good";status.textContent="Bien";setTimeout(choose,620)}
function wrong(heardNote,midi){if(locked||wrongLatch===midi)return;wrongLatch=midi;addAttempt(false);playWrongSound();ring.classList.remove("bad");void ring.offsetWidth;ring.classList.add("bad");heard.className="heard bad";heard.textContent=`${heardNote} · INTENTA OTRA VEZ`;status.className="status bad";status.textContent=`Buscamos ${target.n}`;setTimeout(()=>ring.classList.remove("bad"),600)}
async function startMic(){if(running)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();analyser=audio.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;buf=new Float32Array(analyser.fftSize);audio.createMediaStreamSource(stream).connect(analyser);running=true;next.textContent="NEXT";status.textContent="Escuchando…";listen()}catch(_){status.className="status bad";status.textContent="Activa el permiso del micrófono en Safari"}}
function estimatePitch(b,sr){let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<MIN_RMS)return -1;let best=-1,bestCorr=0;const min=Math.floor(sr/1050),max=Math.floor(sr/70);for(let off=min;off<max;off++){let corr=0;for(let i=0;i<b.length-off;i++)corr+=b[i]*b[i+off];corr/=b.length-off;if(corr>bestCorr){bestCorr=corr;best=off}}return bestCorr>.018?sr/best:-1}
function pitchInfo(f){const raw=69+12*Math.log2(f/440),m=Math.round(raw),cents=Math.round((raw-m)*100),n=NOTES[((m%12)+12)%12];return{m,n,cents}}
function listen(){if(!running)return;analyser.getFloatTimeDomainData(buf);const f=estimatePitch(buf,audio.sampleRate),now=performance.now();if(f<=0){if(now-lastSignal>180){candidateMidi=null;candidateSince=0;wrongLatch=null;heard.className="heard";heard.textContent="GUITAR NOTES"}requestAnimationFrame(listen);return}lastSignal=now;const p=pitchInfo(f);if(candidateMidi!==p.m){candidateMidi=p.m;candidateSince=now}else{const held=now-candidateSince;if(p.n===target.n&&Math.abs(p.cents)<=CENT_TOLERANCE){heard.className="heard";heard.textContent=`${p.n} · ${p.cents>0?"+":""}${p.cents}¢`;if(held>=STABLE_MS)success()}else{heard.className="heard";heard.textContent=`${p.n} · ${p.cents>0?"+":""}${p.cents}¢`;if(p.n!==target.n&&held>=WRONG_STABLE_MS)wrong(p.n,p.m)}}}requestAnimationFrame(listen)}
next.addEventListener("click",async()=>{if(!running){await startMic();return}if(!locked){addAttempt(false);playWrongSound()}choose()});
choose();
})();
</script></body></html>
