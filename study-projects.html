<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis proyectos | FORTISSIMO</title><meta name="theme-color" content="#050505"><link rel="icon" href="assets/fortissimo-icon-20260824.svg"><style>:root{--o:#ff5a00;--bg:#07090b;--muted:#9fa6ab;--line:#ffffff1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,a,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;height:76px;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 20px;background:#07090bf2;border-bottom:1px solid var(--line)}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:850}.brand{justify-self:center}.brand img{width:190px}.shell{width:min(880px,calc(100% - 28px));margin:auto;padding:26px 0 90px}.head{display:flex;align-items:center;justify-content:space-between}.eyebrow{margin:0 0 5px;color:#ff9a5b;font-size:11px;font-weight:950;text-transform:uppercase}.head h1{margin:0;font-size:44px;letter-spacing:-.05em}.intro{margin:8px 0 0;color:var(--muted);font-size:14px}.plus{width:48px;height:48px;border:0;border-radius:14px;background:var(--o);color:#fff;font-size:28px}.filters{display:flex;gap:8px;overflow:auto;padding:20px 0 13px}.filter{min-height:40px;white-space:nowrap;border:1px solid var(--line);border-radius:12px;background:#0c1013;color:#fff;padding:0 15px;font-weight:800}.filter.active{background:var(--o);border-color:var(--o)}.label{margin:7px 2px 10px;color:#bfc4c7;font-size:12px;font-weight:850;text-transform:uppercase}.list{display:grid;gap:11px}.project{display:grid;grid-template-columns:112px minmax(0,1fr) 34px;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:#11161a;color:#fff;text-decoration:none}.project.active{border-color:#ff5a0099}.thumb{height:108px;border-radius:13px;background:radial-gradient(circle at 70% 18%,#ff5a0055,transparent 30%),linear-gradient(135deg,#2c3237,#111);background-position:center;background-size:cover}.instrument{color:#ff9959;font-size:10px;font-weight:950;text-transform:uppercase}.badge{margin-left:7px;padding:3px 6px;border-radius:999px;background:#ff5a0024;color:#ff9b61;font-size:9px;font-weight:950}.info h3{margin:5px 0;font-size:20px}.copy{color:#adb3b7;font-size:12px}.stage{margin-top:4px;font-size:12px;font-weight:800}.songs{margin-top:3px;color:#858d93;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:5px;margin-top:10px;border-radius:99px;background:#31363a;overflow:hidden}.fill{height:100%;background:var(--o)}.chev{font-size:26px;color:#aaa}.ai{margin-top:18px;padding:17px;border:1px solid #ff5a0038;border-radius:16px;background:#11161a}.ai a{display:block;margin-top:12px;padding:13px;border-radius:11px;background:var(--o);color:#fff;text-align:center;text-decoration:none;font-weight:900}.empty{padding:28px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}dialog{width:min(520px,calc(100% - 24px));border:1px solid #ffffff26;border-radius:20px;background:#11161a;color:#fff;padding:0}.modal{padding:22px}.field{display:grid;gap:6px;margin-top:13px}.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#090c0e;color:#fff;padding:10px;font-size:16px}.field textarea{min-height:80px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.btn{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#171b1e;color:#fff;padding:0 14px;font-weight:850}.primary{background:var(--o);border-color:var(--o)}@media(max-width:620px){.top{height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:64px 1fr 64px}.brand img{width:164px}.top>a:first-child{font-size:0}.top>a:first-child:after{content:'← Home';font-size:12px}.head h1{font-size:36px}.project{grid-template-columns:84px minmax(0,1fr) 24px;gap:10px}.thumb{height:90px}.info h3{font-size:17px}}</style></head><body><header class="top"><a href="index.html?internal=1&return=studypaths">← Home</a><a class="brand" href="index.html?internal=1&return=studypaths"><img src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO"></a><span></span></header><main class="shell"><section class="head"><div><p class="eyebrow">Study Paths</p><h1>Mis proyectos</h1><p class="intro">Elige qué quieres estudiar hoy. Cada ruta conserva su propio progreso.</p></div><button class="plus" id="createBtn">+</button></section><nav class="filters" id="filters"></nav><div class="label">Rutas activas</div><section class="list" id="list"></section><section class="ai"><strong>✦ ¿No sabes por dónde empezar?</strong><div class="intro">Deja que la IA cree un plan según tu instrumento, repertorio y destino musical.</div><a href="study-path-ai.html">Crear con IA</a></section></main><dialog id="dlg"><form class="modal" id="form"><h2>Nuevo Study Path</h2><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Instrumento</label><select name="instrument"></select></div><div class="field"><label>Objetivo</label><textarea name="objective" required></textarea></div><div class="actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">Crear y construir</button></div></form></dialog><script src="assets/study-projects-v1.js?v=rebuild2"></script><script src="assets/study-path-progress-v2.js?v=rebuild2"></script><script src="assets/study-path-covers-v1.js?v=cover1"></script><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),fm={'Todos':()=>1,'Guitarra':p=>p.instrument.includes('Guitarra')&&!p.instrument.includes('acústica'),'Bajo':p=>p.instrument.includes('Bajo'),'Acústica':p=>p.instrument.includes('acústica'),'Teclados':p=>p.instrument.includes('Piano'),'Voz':p=>p.instrument==='Voz'};let filter='Todos';function rf(){filters.innerHTML=Object.keys(fm).map(x=>`<button class="filter ${x===filter?'active':''}" data-f="${x}">${x}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;rf();render()})}function card(p){const s=FortissimoPathProgress.stats(p.id,p.stages),active=FortissimoPathProgress.active()===p.id,st=p.stages[Math.max(0,s.current-1)];return`<a class="project ${active?'active':''}" href="study-project.html?id=${encodeURIComponent(p.id)}" data-id="${esc(p.id)}"><div class="thumb"></div><div class="info"><span class="instrument">${esc(p.instrument)}</span>${active?'<span class="badge">ACTUAL</span>':''}<h3>${esc(p.name)}</h3><div class="copy">Stage ${s.current} of ${s.totalStages} · ${s.learned}/${s.totalSongs} canciones</div><div class="stage">${esc(st?.title||'Ruta por construir')}</div><div class="songs">${st?esc(`A ${st.a.artist} — ${st.a.title} · B ${st.b.artist} — ${st.b.title}`):'Agrega la primera dupla A/B'}</div><div class="bar"><div class="fill" style="width:${s.percent}%"></div></div></div><div class="chev">›</div></a>`}async function covers(){document.querySelectorAll('[data-id]').forEach(async a=>{const c=await FortissimoPathCovers.resolve(a.dataset.id),t=a.querySelector('.thumb');if(c.url)t.style.backgroundImage=`linear-gradient(180deg,#0000,#0005),url("${c.url.replace(/"/g,'%22')}")`;else if(a.dataset.id===FortissimoProjects.ROAD_ID)t.style.backgroundImage="linear-gradient(180deg,#0000,#0005),url('assets/foto-guitar-routine-hd.avif?v=guitarhd2')"})}function render(){const active=FortissimoPathProgress.active(),items=FortissimoProjects.all().filter(fm[filter]).sort((a,b)=>a.id===active?-1:b.id===active?1:Number(b.createdAt)-Number(a.createdAt));list.innerHTML=items.length?items.map(card).join(''):'<div class="empty">No tienes rutas en este instrumento.</div>';list.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>FortissimoPathProgress.setActive(a.dataset.id));covers()}form.elements.instrument.innerHTML=FortissimoProjects.instruments.map(x=>`<option>${esc(x)}</option>`).join('');createBtn.onclick=()=>dlg.showModal();cancel.onclick=()=>dlg.close();form.onsubmit=e=>{e.preventDefault();const p=FortissimoProjects.create(Object.fromEntries(new FormData(form)));if(p){FortissimoPathProgress.setActive(p.id);location.href=`study-project-edit.html?id=${encodeURIComponent(p.id)}`}};rf();render();window.addEventListener('fortissimo:path-cover',covers);</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
