<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Study Paths | FORTISSIMO</title><meta name="theme-color" content="#050505" /><link rel="icon" type="image/svg+xml" href="assets/fortissimo-icon-20260824.svg" />
  <style>
    :root{--orange:#ff5a00;--bg:#050505;--text:#fff;--muted:rgba(255,255,255,.63);--line:rgba(255,255,255,.13)}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 78% 0,rgba(255,90,0,.13),transparent 28%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{position:sticky;top:0;z-index:30;height:82px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));background:#050505;border-bottom:1px solid rgba(255,255,255,.065)}.back{font-size:14px;font-weight:850;color:#fff;text-decoration:none}.brand-link{justify-self:center}.brand-logo{display:block;width:220px;max-width:55vw}.spacer{width:70px}.shell{width:min(1180px,calc(100% - 40px));margin:auto;padding:54px 0 90px}.head{display:flex;justify-content:space-between;align-items:end;gap:28px}.eyebrow{margin:0;color:#ff9860;font-size:12px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.head h1{margin:8px 0 0;font-size:clamp(48px,7vw,84px);line-height:.88;letter-spacing:-.065em}.intro{max-width:600px;margin:17px 0 0;color:#bbb;font-size:16px;line-height:1.55}.primary{min-height:52px;padding:0 22px;border:0;border-radius:14px;background:var(--orange);color:#fff;font:inherit;font-weight:900;cursor:pointer}.section-title{margin:46px 0 16px;font-size:14px;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{position:relative;min-height:330px;border:1px solid var(--line);border-radius:25px;background:#111;overflow:hidden}.cover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.88)),url('assets/foto-guitar-routine-hd.avif?v=guitarhd2') 62% center/cover}.custom-cover{background:radial-gradient(circle at 78% 23%,rgba(255,90,0,.32),transparent 25%),linear-gradient(135deg,#242424,#090909)}.custom-cover::after{content:attr(data-initial);position:absolute;right:22px;top:3px;color:rgba(255,255,255,.08);font-size:170px;font-weight:950}.card-content{position:absolute;z-index:2;inset:auto 24px 22px}.meta{color:#ff9860;font-size:11px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.card h2{margin:7px 0 0;font-size:clamp(28px,4vw,42px);line-height:1;letter-spacing:-.045em}.card p{margin:10px 0 0;max-width:520px;color:#c5c5c5;font-size:14px;line-height:1.45}.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.action{min-height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.17);border-radius:10px;background:rgba(5,5,5,.72);color:#fff;font:inherit;font-size:12px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}.action.open{background:var(--orange);border-color:var(--orange)}.empty{grid-column:1/-1;padding:38px;border:1px dashed rgba(255,255,255,.18);border-radius:20px;color:var(--muted);text-align:center}.archived{margin-top:18px}.archived summary{cursor:pointer;color:#aaa;font-size:14px;font-weight:850}.archived .grid{margin-top:15px}.archived .card{min-height:245px;opacity:.72}dialog{width:min(560px,calc(100% - 24px));border:1px solid rgba(255,255,255,.16);border-radius:24px;background:#111;color:#fff;padding:0;box-shadow:0 35px 100px rgba(0,0,0,.7)}dialog::backdrop{background:rgba(0,0,0,.78)}.modal{padding:28px}.modal h2{margin:0;font-size:32px;letter-spacing:-.04em}.field{display:grid;gap:8px;margin-top:19px}.field label{font-size:13px;font-weight:850}.field input,.field select,.field textarea{width:100%;min-height:50px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:#080808;color:#fff;padding:12px 14px;font:inherit;font-size:16px}.field textarea{min-height:105px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.secondary{min-height:48px;padding:0 18px;border:1px solid rgba(255,255,255,.17);border-radius:12px;background:transparent;color:#fff;font:inherit;font-weight:850;cursor:pointer}
    @media(max-width:760px){.topbar{height:calc(74px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}.brand-logo{width:174px}.back{font-size:0}.back::after{content:"← Home";font-size:13px}.shell{width:calc(100% - 24px);padding-top:30px}.head{align-items:start;flex-direction:column}.head .primary{width:100%}.grid{grid-template-columns:1fr}.card{min-height:360px}.modal{padding:22px}}
    .head-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}.head-actions .primary{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.ai-primary{background:#fff;color:#080808}@media(max-width:760px){.head-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.head-actions .primary{padding-inline:10px}}
  </style>
</head>
<body>
  <header class="topbar fortissimo-app-header"><a class="back" href="index.html?internal=1&return=studypaths">← Home</a><a class="brand-link" href="index.html?internal=1&return=studypaths"><img class="brand-logo" src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO" /></a><span class="spacer"></span></header>
  <main class="shell"><section class="head"><div><p class="eyebrow">FORTISSIMO · STUDY PATHS</p><h1>Tus proyectos</h1><p class="intro">Cada instrumento y cada objetivo vive en su propia ruta. El progreso de un proyecto nunca mueve los demás.</p></div><div class="head-actions"><a class="primary ai-primary" href="study-path-ai.html">✦ Crear con IA</a><button class="primary" type="button" data-create>+ Crear manual</button></div></section><h2 class="section-title">Activos</h2><section class="grid" id="activeProjects"></section><details class="archived"><summary>Proyectos archivados (<span id="archivedCount">0</span>)</summary><section class="grid" id="archivedProjects"></section></details></main>
  <dialog id="projectDialog"><form class="modal" id="projectForm"><h2 id="formTitle">Nuevo proyecto</h2><input type="hidden" name="id" /><div class="field"><label for="projectName">Nombre del proyecto</label><input id="projectName" name="name" maxlength="70" required placeholder="Ej. Bass Foundations" /></div><div class="field"><label for="instrument">Instrumento</label><select id="instrument" name="instrument" required></select></div><div class="field"><label for="objective">Objetivo</label><textarea id="objective" name="objective" maxlength="280" required placeholder="¿Qué quieres alcanzar con esta ruta?"></textarea></div><div class="modal-actions"><button class="secondary" type="button" data-close>Cancelar</button><button class="primary" type="submit">Guardar proyecto</button></div></form></dialog>
  <script src="assets/study-path-progress-v1.js?v=phase4"></script><script src="assets/study-projects-v1.js?v=phase5"></script>
  <script>
    const dialog=document.getElementById("projectDialog"),form=document.getElementById("projectForm"),activeRoot=document.getElementById("activeProjects"),archivedRoot=document.getElementById("archivedProjects");
    form.elements.instrument.innerHTML=FortissimoProjects.instruments.map(value=>`<option>${value}</option>`).join("");
    const customCard=project=>`<article class="card"><div class="cover custom-cover" data-initial="${project.instrument.charAt(0)}"></div><div class="card-content"><div class="meta">${project.instrument} · ${(project.stages||[]).length} etapas · ${(project.stages||[]).length*2} canciones</div><h2>${project.name}</h2><p>${project.objective}</p><div class="card-actions">${project.archived?`<button class="action open" data-restore="${project.id}">Restaurar</button>`:`<a class="action open" href="study-project.html?id=${project.id}">${(project.stages||[]).length?"Abrir ruta":"Construir ruta"}</a><button class="action" data-edit="${project.id}">Editar</button><button class="action" data-duplicate="${project.id}">Duplicar</button><button class="action" data-archive="${project.id}">Archivar</button>`}</div></div></article>`;
    function render(){const projects=FortissimoProjects.read(),active=projects.filter(item=>!item.archived),archived=projects.filter(item=>item.archived),roadStats=FortissimoStudyPath.stats();activeRoot.innerHTML=`<article class="card"><div class="cover"></div><div class="card-content"><div class="meta">Guitarra eléctrica · ${roadStats.learned}/24 canciones · Stage ${String(roadStats.current).padStart(2,"0")}</div><h2>Road to Afrobeats</h2><p>Tu ruta oficial desde las raíces del blues y el funk hasta el Afropop actual.</p><div class="card-actions"><a class="action open" href="study-paths.html">${roadStats.learned?"Continuar":"Comenzar"}</a><button class="action" data-duplicate="road-to-afrobeats">Duplicar</button></div></div></article>${active.map(customCard).join("")}`;archivedRoot.innerHTML=archived.length?archived.map(customCard).join(""):`<p class="empty">No tienes proyectos archivados.</p>`;document.getElementById("archivedCount").textContent=archived.length;bindActions()}
    function openForm(project=null){form.reset();form.elements.id.value=project?.id||"";document.getElementById("formTitle").textContent=project?"Editar proyecto":"Nuevo proyecto";if(project){form.elements.name.value=project.name;form.elements.instrument.value=project.instrument;form.elements.objective.value=project.objective}dialog.showModal()}
    function bindActions(){document.querySelectorAll("[data-edit]").forEach(button=>button.onclick=()=>openForm(FortissimoProjects.get(button.dataset.edit)));document.querySelectorAll("[data-duplicate]").forEach(button=>button.onclick=()=>{FortissimoProjects.duplicate(button.dataset.duplicate);render()});document.querySelectorAll("[data-archive]").forEach(button=>button.onclick=()=>{FortissimoProjects.archive(button.dataset.archive,true);render()});document.querySelectorAll("[data-restore]").forEach(button=>button.onclick=()=>{FortissimoProjects.archive(button.dataset.restore,false);render()})}
    document.querySelector("[data-create]").onclick=()=>openForm();document.querySelector("[data-close]").onclick=()=>dialog.close();form.onsubmit=event=>{event.preventDefault();const data=Object.fromEntries(new FormData(form));data.id?FortissimoProjects.update(data.id,data):FortissimoProjects.create(data);dialog.close();render()};dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});render();const editId=new URLSearchParams(location.search).get("edit");if(editId){const project=FortissimoProjects.get(editId);if(project)openForm(project)}
  </script><script src="assets/internal-navigation-v1.js?v=nav1"></script>
</body></html>
