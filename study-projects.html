<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Study Paths | FORTISSIMO</title><meta name="theme-color" content="#050505"><link rel="icon" href="assets/fortissimo-icon-20260824.svg"><style>
:root{--o:#ff6a00;--bg:#07090b;--card:#12171b;--muted:#a5abb0;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,rgba(255,106,0,.10),transparent 28%),var(--bg);color:white;font-family:Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:20;height:76px;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 20px;background:rgba(7,9,11,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.top a{color:white;text-decoration:none;font-weight:800;font-size:13px}.brand{justify-self:center}.brand img{width:190px;display:block}.shell{width:min(900px,calc(100% - 28px));margin:auto;padding:28px 0 90px}.head{display:flex;justify-content:space-between;align-items:center;gap:18px}.head h1{margin:0;font-size:44px;letter-spacing:-.05em}.head p{margin:8px 0 0;color:var(--muted)}.plus{width:52px;height:52px;border:0;border-radius:14px;background:var(--o);color:#fff;font-size:30px;cursor:pointer}.filters{display:flex;gap:8px;overflow:auto;padding:22px 0 14px;scrollbar-width:none}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:12px;background:#0d1114;color:#fff;padding:10px 16px;cursor:pointer}.filter.active{background:var(--o);border-color:var(--o)}.list{display:grid;gap:12px}.project{display:grid;grid-template-columns:118px minmax(0,1fr) 36px;align-items:center;gap:16px;padding:10px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151a1e,#0d1114);text-decoration:none;color:#fff}.thumb{height:108px;border-radius:13px;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.4)),url('assets/foto-guitar-routine-hd.avif?v=guitarhd2') center/cover}.thumb.custom{background:radial-gradient(circle at 70% 20%,rgba(255,106,0,.35),transparent 30%),linear-gradient(135deg,#31383d,#111)}.meta small{color:#ff9b56;font-weight:850}.meta h2{margin:4px 0 6px;font-size:22px;line-height:1.05}.sub{color:var(--muted);font-size:13px}.bar{height:6px;background:#33383c;border-radius:20px;margin-top:12px;overflow:hidden}.fill{height:100%;background:var(--o)}.arrow{font-size:26px;color:#c7cbce}.ai{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#11161a}.ai p{margin:0;color:#d3d6d8}.ai a{background:var(--o);color:white;text-decoration:none;padding:12px 16px;border-radius:12px;font-weight:850}.empty{padding:34px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}dialog{width:min(540px,calc(100% - 24px));border:1px solid var(--line);border-radius:22px;background:#11161a;color:#fff;padding:0}.modal{padding:24px}.modal h2{margin:0 0 14px}.field{display:grid;gap:7px;margin-top:14px}.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;color:#fff;background:#090c0e;border:1px solid var(--line);border-radius:12px;padding:12px}.field textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn{min-height:46px;border-radius:11px;border:1px solid var(--line);background:#111;color:#fff;padding:0 16px;font-weight:850}.btn.primary{background:var(--o);border-color:var(--o)}@media(max-width:620px){.top{height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:64px 1fr 64px}.brand img{width:164px}.top>a:first-child{font-size:0}.top>a:first-child:after{content:"← Home";font-size:12px}.shell{padding-top:20px}.head h1{font-size:36px}.project{grid-template-columns:88px minmax(0,1fr) 24px;gap:12px}.thumb{height:92px}.meta h2{font-size:18px}.ai{align-items:flex-start;flex-direction:column}.ai a{width:100%;text-align:center}}
</style></head><body><header class="top"><a href="index.html?internal=1&return=studypaths">← Home</a><a class="brand" href="index.html?internal=1&return=studypaths"><img src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO"></a><span></span></header><main class="shell"><section class="head"><div><h1>Study Paths</h1><p>Tus rutas de aprendizaje por instrumento y objetivo.</p></div><button class="plus" id="createBtn" aria-label="Crear proyecto">+</button></section><nav class="filters" id="filters"></nav><section class="list" id="list"></section><section class="ai"><p>✦ ¿No sabes por dónde empezar?<br><span style="color:#9da4a9">Deja que la IA cree el plan perfecto para ti.</span></p><a href="study-path-ai.html">Crear con IA</a></section></main><dialog id="dlg"><form class="modal" id="form"><h2>Nuevo Study Path</h2><div class="field"><label>Nombre</label><input name="name" required maxlength="70" placeholder="Ej. Afro Bass Foundation"></div><div class="field"><label>Instrumento</label><select name="instrument" required></select></div><div class="field"><label>Objetivo</label><textarea name="objective" required maxlength="280"></textarea></div><div class="actions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">Crear y construir</button></div></form></dialog><script src="assets/study-projects-v1.js?v=rebuild1"></script><script src="assets/study-path-progress-v2.js?v=rebuild1"></script><script>
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));let filter="Todos";const filterMap={"Todos":()=>true,"Guitarra":p=>p.instrument.includes("Guitarra"),"Bajo":p=>p.instrument.includes("Bajo"),"Acústica":p=>p.instrument.includes("acústica"),"Teclados":p=>p.instrument.includes("Piano"),"Voz":p=>p.instrument==="Voz"};function renderFilters(){filters.innerHTML=Object.keys(filterMap).map(x=>`<button class="filter ${x===filter?"active":""}" data-f="${x}">${x}</button>`).join("");filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();render()})}function card(p){const s=FortissimoPathProgress.stats(p.id,p.stages),current=p.stages[Math.max(0,s.current-1)],custom=p.system?"":" custom";return`<a class="project" href="study-project.html?id=${encodeURIComponent(p.id)}" data-id="${esc(p.id)}"><div class="thumb${custom}"></div><div class="meta"><small>${esc(p.instrument)}</small><h2>${esc(p.name)}</h2><div class="sub">Stage ${s.current||0} of ${s.totalStages} &nbsp;•&nbsp; ${s.learned} / ${s.totalSongs} canciones${current?`<br>${esc(current.a.title)} / ${esc(current.b.title)}`:""}</div><div class="bar"><div class="fill" style="width:${s.percent}%"></div></div></div><div class="arrow">›</div></a>`}function render(){const items=FortissimoProjects.all().filter(filterMap[filter]);list.innerHTML=items.length?items.map(card).join(""):`<div class="empty">No tienes rutas en este instrumento.</div>`}const dlg=document.getElementById("dlg"),form=document.getElementById("form");form.elements.instrument.innerHTML=FortissimoProjects.instruments.map(x=>`<option>${esc(x)}</option>`).join("");createBtn.onclick=()=>dlg.showModal();cancel.onclick=()=>dlg.close();form.onsubmit=e=>{e.preventDefault();const p=FortissimoProjects.create(Object.fromEntries(new FormData(form)));if(p){FortissimoPathProgress.setActive(p.id);location.href=`study-project-edit.html?id=${encodeURIComponent(p.id)}`}};renderFilters();render();
</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
