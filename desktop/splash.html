<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FORTISSIMO Desktop</title>
  <style>
    :root{color-scheme:dark;--orange:#ff5a00;--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.58);--hold:8000ms}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Inter,"Segoe UI",system-ui,sans-serif}
    body{display:grid;place-items:center}
    .boot{width:100%;height:100%;display:grid;grid-template-columns:.9fr 1.1fr;border:1px solid var(--line);background:radial-gradient(circle at 82% 22%,rgba(255,90,0,.16),transparent 32%),linear-gradient(145deg,#101010,#050505 62%);position:relative;overflow:hidden}
    .boot::after{content:"";position:absolute;inset:auto -15% -48% 28%;height:85%;background:radial-gradient(ellipse,rgba(255,90,0,.13),transparent 66%);pointer-events:none}
    .identity{padding:48px 34px 38px 44px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);position:relative;z-index:1}
    .logo{width:184px;max-height:60px;object-fit:contain;object-position:left center}.credit{font-size:11px;line-height:1.65;color:var(--muted)}.credit strong{color:#fff}.place{margin-top:14px;color:rgba(255,255,255,.78);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .hero{padding:44px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}.mark{width:86px;height:86px;object-fit:contain;margin-bottom:24px}.eyebrow{font-size:10px;color:#ff9a5b;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.title{margin:7px 0 4px;font-size:44px;line-height:.92;letter-spacing:-.055em;font-weight:950}.subtitle{color:var(--muted);font-size:13px;font-weight:700}.version{margin-top:24px;display:inline-flex;align-items:center;gap:9px;width:max-content;padding:8px 12px;border:1px solid rgba(255,90,0,.38);border-radius:999px;background:rgba(255,90,0,.07);font-size:11px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 18px rgba(255,90,0,.6)}
    .status{position:absolute;left:44px;right:44px;bottom:42px;display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.48);font-size:10px;font-weight:700;letter-spacing:.04em}.loader{display:flex;gap:4px}.loader i{width:4px;height:4px;border-radius:50%;background:var(--orange);animation:pulse 1.05s infinite ease-in-out}.loader i:nth-child(2){animation-delay:.14s}.loader i:nth-child(3){animation-delay:.28s}
    .progress{position:absolute;left:44px;right:44px;bottom:27px;height:2px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08)}.progress::after{content:"";display:block;width:100%;height:100%;transform:translateX(-100%);background:linear-gradient(90deg,rgba(255,90,0,.22),#ff5a00);animation:bootProgress var(--hold) cubic-bezier(.2,.75,.25,1) forwards}
    @keyframes pulse{0%,70%,100%{opacity:.24;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}@keyframes bootProgress{0%{transform:translateX(-100%)}18%{transform:translateX(-80%)}48%{transform:translateX(-48%)}76%{transform:translateX(-22%)}92%{transform:translateX(-8%)}100%{transform:translateX(0)}}
  </style>
</head>
<body>
  <main class="boot">
    <section class="identity">
      <img class="logo" id="logo" alt="FORTISSIMO" />
      <div>
        <div class="credit"><strong>Developed, programmed &amp; calibrated by SERRA.</strong><br />Built for the creative development of the SERRA artist team.</div>
        <div class="place">Santo Domingo · Dominican Republic · 2026</div>
      </div>
    </section>
    <section class="hero">
      <img class="mark" id="mark" alt="FORTISSIMO icon" />
      <div class="eyebrow">Gym for Musicians</div>
      <h1 class="title">FORTISSIMO<br />Desktop</h1>
      <div class="subtitle">Creative tools for musicians, writers &amp; producers.</div>
      <div class="version"><span class="dot"></span><span id="version">Desktop</span></div>
      <div class="status"><span class="loader"><i></i><i></i><i></i></span><span id="status">Preparing FORTISSIMO workspace…</span></div>
      <div class="progress" aria-hidden="true"></div>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const version=params.get('version')||'—';
    const logo=params.get('logo')||'';
    const mark=params.get('mark')||'';
    const holdMs=Math.max(1000,Number(params.get('holdMs'))||8000);
    document.documentElement.style.setProperty('--hold',`${holdMs}ms`);
    document.getElementById('version').textContent=`Desktop v${version}`;
    if(logo)document.getElementById('logo').src=logo;
    if(mark)document.getElementById('mark').src=mark;
    const status=document.getElementById('status');
    window.setFortissimoBootStatus=(value)=>{status.textContent=String(value||'Preparing FORTISSIMO workspace…')};
    const stages=[
      [1150,'Preparing secure Desktop runtime…'],
      [3000,'Preparing audio and project workspace…'],
      [5000,'Loading native MIDI workflow…'],
      [6750,'Restoring FORTISSIMO workspace…']
    ];
    stages.forEach(([at,label])=>setTimeout(()=>{if(!/ready/i.test(status.textContent))status.textContent=label},Math.min(at,holdMs-250)));
  </script>
</body>
</html>
