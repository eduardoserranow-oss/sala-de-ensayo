<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Play Songs | FORTISSIMO</title>
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="assets/fortissimo-icon-20260824.svg?v=fortissimo-icon8" />
  <style>
    :root{--orange:#ff6500;--bg:#050505;--bar:60px;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{min-height:100dvh}
    .shell{height:100dvh;display:flex;flex-direction:column;background:#050505}
    .topbar{position:relative;z-index:20;flex:0 0 calc(var(--bar) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);background:rgba(5,5,5,.96);backdrop-filter:blur(18px)}
    .home-btn,.external-btn{height:40px;border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:850}
    .home-btn{width:40px;background:rgba(255,255,255,.06);color:#fff;font-size:20px}
    .brand{justify-self:center;width:min(164px,44vw);height:auto;display:block}
    .external-btn{padding:0 13px;background:rgba(255,101,0,.12);border:1px solid rgba(255,101,0,.34);color:#ff8a3d;font-size:11px;white-space:nowrap}
    .stage{position:relative;flex:1;min-height:0;background:#090909}
    .moises-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0b0b}
    .loading{position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;background:#080808;transition:opacity .25s ease,visibility .25s ease}
    .loading.is-hidden{opacity:0;visibility:hidden}
    .loading-inner{text-align:center;color:rgba(255,255,255,.54);font-size:12px}
    .spinner{width:26px;height:26px;margin:0 auto 12px;border:2px solid rgba(255,255,255,.12);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fallback{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:none;padding:10px 12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(12,12,12,.92);box-shadow:0 12px 32px rgba(0,0,0,.35);font-size:10px;color:rgba(255,255,255,.72)}
    .fallback a{color:#ff8a3d;font-weight:850;text-decoration:none}
    @media(max-width:620px){
      :root{--bar:54px}
      .topbar{padding-left:8px;padding-right:8px;grid-template-columns:40px 1fr 40px}
      .brand{width:min(148px,45vw)}
      .external-btn{width:40px;padding:0;font-size:0}
      .external-btn::before{content:"↗";font-size:17px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="home-btn" href="./?internal=1&return=playsongs" aria-label="Back to FORTISSIMO Home">←</a>
      <img class="brand" src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO" />
      <a class="external-btn" href="https://app.moises.ai/" target="_blank" rel="noopener noreferrer" aria-label="Open Moises directly">Open Moises</a>
    </header>

    <section class="stage" aria-label="Moises Play Songs">
      <div class="loading" id="loading"><div class="loading-inner"><div class="spinner"></div>Opening Moises…</div></div>
      <iframe
        class="moises-frame"
        id="moisesFrame"
        src="https://app.moises.ai/"
        title="Moises Web App"
        allow="autoplay; clipboard-read; clipboard-write; fullscreen; microphone"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <div class="fallback" id="fallback">If Moises does not appear here, <a href="https://app.moises.ai/" target="_blank" rel="noopener noreferrer">open it directly</a>.</div>
    </section>
  </main>

  <script>
    (function(){
      const SESSION_KEY="myLessons.localSession";
      function getSession(){
        try{return JSON.parse(localStorage.getItem(SESSION_KEY))||JSON.parse(sessionStorage.getItem(SESSION_KEY));}
        catch(_){return null;}
      }
      const session=getSession();
      if(!session?.cloudAccountId||!session?.cloudToken){
        const url=new URL("login.html",location.href);
        url.searchParams.set("returnTo","play-songs.html");
        location.replace(url.href);
        return;
      }

      const frame=document.getElementById("moisesFrame");
      const loading=document.getElementById("loading");
      const fallback=document.getElementById("fallback");
      let loaded=false;
      frame.addEventListener("load",()=>{
        loaded=true;
        loading?.classList.add("is-hidden");
      });
      setTimeout(()=>{
        loading?.classList.add("is-hidden");
        if(!loaded&&fallback)fallback.style.display="block";
      },6500);
    })();
  </script>
</body>
</html>
