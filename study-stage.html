<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stage | FORTISSIMO</title><meta name="theme-color" content="#050505"><link rel="icon" href="assets/fortissimo-icon-20260824.svg"><style>
:root{--o:#ff6a00;--bg:#07090b;--muted:#a5abb0;--line:rgba(255,255,255,.1);--green:#2fa55d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(255,106,0,.09),transparent 25%),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}.top{height:76px;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,9,11,.96);z-index:20}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:850}.brand{justify-self:center}.brand img{width:190px}.shell{width:min(880px,calc(100% - 28px));margin:auto;padding:26px 0 90px}.ey{color:#ff9d59;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero{display:grid;grid-template-columns:1fr minmax(250px,.7fr);gap:18px;align-items:end}.hero h1{margin:7px 0 0;font-size:clamp(38px,6vw,64px);line-height:.92;letter-spacing:-.055em}.objective{padding:18px;border:1px solid var(--line);border-radius:16px;background:#11161a;color:#d5d8da;line-height:1.5}.objective b{display:block;color:#ff9d59;margin-bottom:6px}.pair{display:grid;grid-template-columns:1fr 54px 1fr;gap:12px;align-items:start;margin-top:22px}.song{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151a1e,#0d1114);overflow:hidden}.songTop{padding:18px}.role{color:#ff9d59;font-size:11px;font-weight:900;text-transform:uppercase}.song h2{margin:5px 0 2px;font-size:24px}.artist{color:var(--muted);font-size:13px}.study{margin:14px 0 0;color:#d5d8da;font-size:14px;line-height:1.5}.checks{border-top:1px solid var(--line);padding:14px 18px}.check{display:flex;align-items:center;gap:10px;padding:8px 0;color:#c8cdd0;font-size:13px}.check input{width:18px;height:18px;accent-color:var(--o)}.learned{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#151a1e;color:#fff;font-weight:900}.learned[aria-pressed="true"]{background:var(--green);border-color:var(--green)}.bridge{display:grid;place-items:center;color:var(--o);font-size:30px;padding-top:90px}.connection{margin-top:16px;padding:18px;border:1px solid rgba(255,106,0,.3);border-radius:16px;background:rgba(255,106,0,.07);color:#d8dbdd;line-height:1.55}.connection b{color:#ff9d59}.complete{margin-top:18px;display:grid;place-items:center}.complete button{min-width:min(360px,100%);min-height:54px;border:0;border-radius:14px;background:var(--o);color:#fff;font-weight:950;font-size:15px}.complete button:disabled{background:#252a2e;color:#777}.complete button.done{background:#fff;color:#111}.hint{margin:8px 0 0;color:var(--muted);font-size:12px;text-align:center}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:20px}.nav a{min-height:46px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:12px;color:#fff;text-decoration:none;background:#11161a;font-size:12px;font-weight:850}.nav a:nth-child(2){border:0;background:none;color:var(--muted)}.nav a:last-child{justify-content:flex-end}.disabled{visibility:hidden}@media(max-width:700px){.top{height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:64px 1fr 64px}.brand img{width:164px}.top>a:first-child{font-size:0}.top>a:first-child:after{content:"← Ruta";font-size:12px}.shell{padding-top:18px}.hero{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.bridge{padding:0;height:38px;transform:rotate(90deg)}.song h2{font-size:22px}.nav{grid-template-columns:1fr 1fr}.nav a:nth-child(2){grid-column:1/-1;grid-row:2;justify-content:center}}
</style></head><body><header class="top"><a id="back" href="study-projects.html">← Ruta</a><a class="brand" href="index.html?internal=1&return=studypaths"><img src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO"></a><span></span></header><main class="shell" id="root"></main><script src="assets/study-projects-v1.js?v=rebuild1"></script><script src="assets/study-path-progress-v2.js?v=rebuild1"></script><script>
const q=new URLSearchParams(location.search),id=q.get("id")||FortissimoProjects.ROAD_ID,p=FortissimoProjects.get(id),n=Math.max(1,Number(q.get("stage"))||1),idx=n-1,root=document.getElementById("root"),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));back.href=`study-project.html?id=${encodeURIComponent(id)}`;function songCard(stage,role,label){const s=stage[role],state=FortissimoPathProgress.stageState(id,stage,p.stages)[role];return`<article class="song"><div class="songTop"><div class="role">${label}</div><h2>${esc(s.title)}</h2><div class="artist">${esc(s.artist)}</div><p class="study">${esc(s.study)}</p></div><div class="checks">${FortissimoPathProgress.DEFAULT_CHECKS.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${role}:${i}" ${state.checks?.[i]?"checked":""}>${esc(x)}</label>`).join("")}<button class="learned" data-learn="${role}" aria-pressed="${state.learned}">${state.learned?"✓ Aprendida":"Learning → Learned"}</button></div></article>`}function render(){if(!p||!p.stages[idx]){root.innerHTML='<p>Stage no disponible.</p>';return}if(!FortissimoPathProgress.isUnlocked(id,idx,p.stages)){location.href=`study-project.html?id=${encodeURIComponent(id)}`;return}FortissimoPathProgress.setActive(id);const st=p.stages[idx],state=FortissimoPathProgress.stageState(id,st,p.stages),done=state.completed,ready=state.a.learned&&state.b.learned;document.title=`${st.title} | ${p.name}`;root.innerHTML=`<section class="hero"><div><p class="ey">Stage ${String(n).padStart(2,"0")} of ${p.stages.length} · ${esc(p.name)}</p><h1>${esc(st.title)}</h1></div><div class="objective"><b>Objetivo del Stage</b>${esc(st.objective)}</div></section><section class="pair">${songCard(st,"a","A · Learn the language")}<div class="bridge">→</div>${songCard(st,"b","B · Use the language")}</section><div class="connection"><b>La conexión A → B</b><br>${esc(st.connection)}</div><div class="complete"><button id="complete" ${!ready||done?"disabled":""} class="${done?"done":""}">${done?"✓ Stage completado":"Complete Stage"}</button><p class="hint">${done?"Siguiente etapa desbloqueada.":ready?"Ya puedes completar esta etapa.":"Marca ambas canciones como aprendidas para desbloquear Complete Stage."}</p></div><nav class="nav"><a class="${idx===0?"disabled":""}" href="study-stage.html?id=${encodeURIComponent(id)}&stage=${idx}">← Anterior</a><a href="study-project.html?id=${encodeURIComponent(id)}">Ver ruta completa</a><a class="${idx===p.stages.length-1||!done?"disabled":""}" href="study-stage.html?id=${encodeURIComponent(id)}&stage=${idx+2}">Siguiente →</a></nav>`;root.querySelectorAll("[data-check]").forEach(el=>el.onchange=()=>{const [r,k]=el.dataset.check.split(":");FortissimoPathProgress.toggleCheck(id,st.id,r,k,p.stages)});root.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>{FortissimoPathProgress.toggleLearned(id,st.id,b.dataset.learn,p.stages);render()});document.getElementById("complete").onclick=()=>{FortissimoPathProgress.completeStage(id,idx,p.stages);render()}}render();
</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
