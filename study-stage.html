  <style>
    :root{--orange:#ff5a00;--bg:#050505;--surface:#111;--text:#fff;--muted:rgba(255,255,255,.65);--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(255,90,0,.12),transparent 28%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.topbar{position:sticky;top:0;z-index:50;height:82px;display:grid;grid-template-columns:110px minmax(0,1fr) 110px;align-items:center;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));background:#050505;border-bottom:1px solid rgba(255,255,255,.065)}.back{font-size:14px;font-weight:850;text-decoration:none;white-space:nowrap}.brand-link{justify-self:center;display:inline-flex}.brand-logo{display:block;width:220px;max-width:55vw;height:auto}.top-spacer{width:110px}.shell{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:46px 0 max(90px,env(safe-area-inset-bottom))}.eyebrow{margin:0;color:#ff9860;font-size:12px;font-weight:950;letter-spacing:.15em;text-transform:uppercase}.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:28px;align-items:end}.intro h1{margin:12px 0 0;font-size:clamp(46px,7vw,86px);line-height:.88;letter-spacing:-.065em}.objective{padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#171717,#0d0d0d)}.objective span{display:block;color:#ff9860;font-size:11px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}.objective p{margin:9px 0 0;color:#d0d0d0;font-size:16px;line-height:1.55}.pair{display:grid;grid-template-columns:minmax(0,1fr) 100px minmax(0,1fr);gap:18px;align-items:center;margin-top:42px}.song-card{border:1px solid var(--line);border-radius:26px;background:#101010;overflow:hidden;box-shadow:0 24px 65px rgba(0,0,0,.3)}.artwork{position:relative;aspect-ratio:1;background:linear-gradient(145deg,#272727,#101010);overflow:hidden}.artwork img{width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .3s}.artwork img.loaded{opacity:1}.fallback{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.14);font-size:clamp(100px,15vw,190px);font-weight:950}.role{position:absolute;left:18px;top:18px;z-index:2;padding:9px 12px;border-radius:999px;background:rgba(5,5,5,.84);backdrop-filter:blur(10px);font-size:11px;font-weight:950;letter-spacing:.1em}.role b{color:var(--orange)}.song-copy{padding:25px}.artist{margin:0;color:#ff9860;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.song-copy h2{margin:7px 0 0;font-size:clamp(28px,4vw,44px);line-height:1;letter-spacing:-.045em}.study-label{display:block;margin-top:24px;color:#999;font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}.study{margin:7px 0 0;color:#d0d0d0;font-size:15px;line-height:1.55}.bridge{display:grid;place-items:center;color:var(--orange);font-size:38px;font-weight:900}.connection{margin-top:22px;padding:28px;border:1px solid rgba(255,90,0,.3);border-radius:22px;background:linear-gradient(135deg,rgba(255,90,0,.11),rgba(255,90,0,.025))}.connection span{display:block;color:#ff9860;font-size:11px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}.connection p{margin:9px 0 0;max-width:930px;color:#ddd;font-size:17px;line-height:1.65}.navigation{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:30px}.nav-button{display:flex;align-items:center;gap:11px;min-height:58px;padding:14px 18px;border:1px solid var(--line);border-radius:15px;background:#101010;text-decoration:none;font-size:13px;font-weight:850}.nav-button.next{justify-content:flex-end;text-align:right}.nav-button.disabled{visibility:hidden}.all-stages{color:var(--muted);font-size:13px;font-weight:800;text-decoration:none}.phase-note{margin:30px 0 0;color:#888;font-size:12px;text-align:center}
    @media(max-width:850px){.intro{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.bridge{height:42px;transform:rotate(90deg)}.song-card{max-width:620px;width:100%;margin:auto}}
    @media(max-width:650px){.topbar{height:calc(74px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:62px minmax(0,1fr) 62px}.brand-logo{width:174px}.back{font-size:0}.back::after{content:"← Ruta";font-size:13px}.top-spacer{width:62px}.shell{width:calc(100% - 24px);padding-top:28px}.intro h1{font-size:clamp(42px,14vw,64px)}.objective{padding:20px}.pair{margin-top:28px}.song-card{border-radius:21px}.song-copy{padding:21px}.connection{padding:22px}.navigation{grid-template-columns:1fr 1fr}.all-stages{grid-column:1/-1;grid-row:2;text-align:center;padding:12px}.nav-button{padding:12px;font-size:12px}}
  </style>

<body>
  <header class="topbar fortissimo-app-header"><a class="back" href="study-paths.html">← Ruta completa</a><a class="brand-link" href="index.html?internal=1&return=studypaths" aria-label="Ir al Home de FORTISSIMO"><img class="brand-logo" src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO" /></a><span class="top-spacer" aria-hidden="true"></span></header>
  <main class="shell" id="stageRoot"></main>
  <script>
    const stages=[
      {title:"Blues → Blues moderno",objective:"Construir fraseo expresivo, control dinámico y sentido del espacio antes de llevar el blues a un pocket contemporáneo.",a:["B.B. King","The Thrill Is Gone","Fraseo, bends, vibrato, pentatónica, dinámica y espacio."],b:["John Mayer","Gravity","Llevar el lenguaje blues a un contexto moderno: fills, pocket y clean/crunch."],connection:"Primero aprendes a hacer que cada nota tenga intención y respiración. Después aplicas esa expresividad dentro de un arreglo moderno, más contenido y conectado con el groove."},
      {title:"Hendrix → Guitarra moderna",objective:"Aprender a unir acordes, melodía y ornamentación para acompañar sin separar ritmo y lead.",a:["Jimi Hendrix","Little Wing","Acordes con melodía, double-stops, hammer-ons, fills e inversiones."],b:["John Mayer","Slow Dancing in a Burning Room","Aplicar el vocabulario Hendrix a una balada/blues contemporánea."],connection:"Little Wing presenta el idioma completo. Slow Dancing conserva ese ADN, pero lo organiza dentro de una canción moderna con más espacio, repetición y control del acompañamiento."},
      {title:"Funk → Funk moderno",objective:"Desarrollar precisión rítmica de semicorcheas, muting y control de mano derecha.",a:["Chic","Le Freak","Tríadas, inversiones, semicorcheas, muting, staccato y mano derecha."],b:["Daft Punk","Get Lucky","Reconocer y aplicar el mismo ADN de Nile Rodgers en producción moderna."],connection:"Le Freak te enseña la mecánica y el lenguaje clásico del funk. Get Lucky demuestra cómo ese mismo vocabulario puede convertirse en una parte limpia, elegante y central dentro de una producción pop moderna."},
      {title:"Rock / Texturas → Rock latino",objective:"Construir resistencia, precisión de arpegios y criterio para usar efectos como parte del arreglo.",a:["The Police","Message in a Bottle","Arpegios, add9, precisión, resistencia y guitarra con efectos."],b:["Soda Stereo","En la Ciudad de la Furia","Texturas, arpegios y uso musical de chorus, delay y reverb."],connection:"The Police desarrolla la precisión física y armónica. Soda Stereo transforma esos recursos en una atmósfera de rock latino donde los efectos dejan de ser decoración y pasan a contar parte de la canción."},
      {title:"Reggae: contratiempo y espacio",objective:"Dominar el contratiempo y aprender que el silencio también forma parte del groove.",a:["Bob Marley & The Wailers","Stir It Up","Skank, contratiempo, staccato, muting y espacio."],b:["Bob Marley & The Wailers","Could You Be Loved","Evolucionar hacia una parte reggae más móvil sin perder el pocket."],connection:"Stir It Up establece el skank y la disciplina del espacio. Could You Be Loved añade movimiento y variación sin abandonar la estabilidad rítmica que sostiene al reggae."},
      {title:"Soul/Funk → Pop-Funk moderno",objective:"Aprender a crear impacto con pocas notas, dinámica y articulación limpia.",a:["Prince","Kiss","Minimalismo, clean funk, muting, dinámica y economía de notas."],b:["John Mayer","New Light","Aplicar ese lenguaje a pop moderno y aprender a no tocar de más."],connection:"Kiss enseña que la energía no depende de llenar todos los espacios. New Light lleva esa economía al pop contemporáneo y obliga a elegir únicamente las notas que realmente ayudan al arreglo."},
      {title:"Guitarra latina",objective:"Integrar fraseo, riffs y fills con percusión sin competir con ella.",a:["Santana","Oye Como Va","Fraseo latino, sustain, pentatónica/dórico y convivencia con percusión."],b:["Maná","Oye Mi Amor","Riff, acompañamiento rock latino, fills y control del espacio."],connection:"Santana desarrolla una voz melódica que conversa con la percusión. Maná convierte esa relación en un lenguaje de riff y acompañamiento más directo dentro del rock latino."},
      {title:"Neo-Soul → R&B moderno",objective:"Ampliar el vocabulario armónico y mejorar el voice leading dentro de acompañamientos suaves.",a:["Tom Misch","It Runs Through Me","Tríadas, acordes de séptima, slides, ghost notes y mezcla de funk/jazz."],b:["Daniel Caesar ft. H.E.R.","Best Part","Maj7/m7, voice leading, dinámica y acompañamiento R&B."],connection:"Tom Misch mezcla precisión funk con color jazzístico. Best Part reduce ese vocabulario a movimientos de voces suaves y musicales que sostienen la canción sin invadirla."},
      {title:"Palm-Wine → Highlife",objective:"Entender cómo los patrones cíclicos de bajo y melodía evolucionan hacia guitarras africanas interconectadas.",a:["S.E. Rogie","My Lovely Elizabeth","Fingerstyle, bajo + melodía y patrones cíclicos."],b:["E.T. Mensah & His Tempos","All For You","Entender cómo la guitarra se vuelve más rítmica, sincopada e interconectada."],connection:"Palm-Wine presenta la independencia entre bajo y melodía dentro de una sola guitarra. Highlife distribuye esa lógica en patrones rítmicos que se entrelazan con el resto de la banda."},
      {title:"Highlife → Makossa",objective:"Fortalecer el groove repetitivo y escuchar la guitarra como parte de una conversación rítmica colectiva.",a:["Osibisa","Sunshine Day","Highlife fusionado con funk, jazz y rock; groove y figuras repetitivas."],b:["Manu Dibango","Soul Makossa","Escuchar especialmente la conversación entre guitarra, bajo y percusión."],connection:"Sunshine Day integra Highlife con lenguajes occidentales ya estudiados. Soul Makossa te obliga a escuchar cómo la guitarra encuentra su lugar exacto entre bajo, percusión y repetición."},
      {title:"Afrobeat → Afrobeats moderno",objective:"Desarrollar disciplina rítmica en patrones repetitivos y comprender su reducción hacia la producción moderna.",a:["Fela Kuti","Zombie","Repetición, interlocking guitars, Highlife + funk + jazz y disciplina rítmica."],b:["Burna Boy","On The Low","Reconocer cómo ese lenguaje se vuelve minimalista y contemporáneo."],connection:"Zombie reúne las raíces: Highlife, funk, jazz e interlocking. On The Low conserva el pocket y la síncopa, pero reduce la información para dejar más espacio a la voz y a la producción."},
      {title:"Afrobeats / Afropop actual",objective:"Integrar síncopa, pocket, muting, melodía y minimalismo en el lenguaje actual de guitarra afro.",a:["Wizkid","Joro","Línea limpia repetitiva, síncopa, espacio y pocket."],b:["Rema","Calm Down","Integrar muting, melodía, groove, minimalismo y producción moderna."],connection:"Joro consolida la repetición limpia y el espacio. Calm Down reúne todo el recorrido en una parte sencilla, melódica y precisa que funciona dentro del Afropop contemporáneo."}
    ];
    const requested=Number(new URLSearchParams(location.search).get("stage"));
    const index=Number.isInteger(requested)&&requested>=1&&requested<=stages.length?requested-1:0;
    const stage=stages[index],label=String(index+1).padStart(2,"0");
    const songCard=(song,role,meaning)=>`<article class="song-card"><div class="artwork"><div class="fallback">${role}</div><img data-artist="${song[0]}" data-title="${song[1]}" alt="Portada de ${song[1]} de ${song[0]}" /><span class="role"><b>${role}</b> · ${meaning}</span></div><div class="song-copy"><p class="artist">${song[0]}</p><h2>${song[1]}</h2><span class="study-label">Qué estudiar</span><p class="study">${song[2]}</p></div></article>`;
    document.title=`Stage ${label} · ${stage.title} | FORTISSIMO`;
    document.getElementById("stageRoot").innerHTML=`<section class="intro"><div><p class="eyebrow">Road to Afrobeats · Stage ${label} of 12</p><h1>${stage.title}</h1></div><aside class="objective"><span>Objetivo de la etapa</span><p>${stage.objective}</p></aside></section><section class="pair" aria-label="Dupla de canciones">${songCard(stage.a,"A","Aprende el lenguaje")}<div class="bridge" aria-hidden="true">→</div>${songCard(stage.b,"B","Aplica el lenguaje")}</section><section class="connection"><span>La conexión A → B</span><p>${stage.connection}</p></section><nav class="navigation" aria-label="Navegación entre etapas"><a class="nav-button${index===0?" disabled":""}" href="study-stage.html?stage=${index}">← Stage ${String(index).padStart(2,"0")}</a><a class="all-stages" href="study-paths.html">Ver las 12 etapas</a><a class="nav-button next${index===stages.length-1?" disabled":""}" href="study-stage.html?stage=${index+2}">Stage ${String(index+2).padStart(2,"0")} →</a></nav><p class="phase-note">En la Fase 4 añadiremos los checks y el guardado de tu progreso.</p>`;
    async function loadArtwork(img){try{const term=encodeURIComponent(`${img.dataset.artist} ${img.dataset.title}`);const response=await fetch(`https://itunes.apple.com/search?term=${term}&entity=song&limit=8`);const data=await response.json();const exact=data.results.find(item=>item.trackName?.toLowerCase()===img.dataset.title.toLowerCase())||data.results[0];if(!exact?.artworkUrl100)return;img.onload=()=>img.classList.add("loaded");img.src=exact.artworkUrl100.replace("100x100bb","1000x1000bb")}catch(error){console.warn("No se pudo cargar la portada",error)}}
    document.querySelectorAll(".artwork img").forEach(loadArtwork);
  </script>
  <script src="assets/internal-navigation-v1.js?v=nav1"></script>
</body>
