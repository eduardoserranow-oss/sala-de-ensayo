:root{--o:#ff6a00;--bg:#07090b;--muted:#a5abb0;--line:rgba(255,255,255,.1);--green:#2fa55d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(255,106,0,.08),transparent 24%),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,a,input{font:inherit}.top{height:76px;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,9,11,.96);z-index:20}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:850}.brand{justify-self:center}.brand img{width:190px}.shell{width:min(900px,calc(100% - 28px));margin:auto;padding:26px 0 90px}.ey{margin:0;color:#ff9d59;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.hero h1{margin:7px 0 12px;font-size:clamp(38px,6vw,62px);line-height:.93;letter-spacing:-.05em}.why{padding:18px;border:1px solid rgba(255,106,0,.26);border-radius:16px;background:rgba(255,106,0,.055);color:#d9dcde;line-height:1.55}.why b{color:#ff9d59}.skills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.skill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#101418;color:#d4d8da;font-size:11px;font-weight:850}.pair{display:grid;grid-template-columns:1fr 50px 1fr;gap:12px;align-items:start;margin-top:22px}.song{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151a1e,#0d1114);overflow:hidden}.songTop{padding:18px}.identity{display:grid;grid-template-columns:78px 1fr;gap:13px;align-items:center;margin-top:9px}.art{width:78px;aspect-ratio:1;border-radius:8px;background:linear-gradient(145deg,#242b31,#101418);display:grid;place-items:center;overflow:hidden;color:#70777c;font-size:22px}.art img{width:100%;height:100%;object-fit:contain;display:block}.role{color:#ff9d59;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.song h2{margin:0 0 3px;font-size:22px}.artist{color:var(--muted);font-size:13px}.releaseMeta{min-height:18px;margin-top:5px;font-size:10px;color:#737b80;line-height:1.35}.releaseMeta a{color:#ff6b6b;text-decoration:none;font-weight:850}.releaseName{display:block;margin-top:2px;color:#8e969b}.study{margin:14px 0 0;color:#d5d8da;font-size:14px;line-height:1.5}.block{border-top:1px solid var(--line);padding:16px 18px}.block h3{margin:0 0 10px;font-size:13px}.block ul{margin:0;padding-left:18px;color:#c5cbd0;font-size:13px;line-height:1.55}.toneGrid{display:grid;gap:8px}.toneRow{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:12px}.toneRow span{color:#858d93}.toneRow strong{color:#e4e7e9}.mastery{display:grid;gap:8px}.mastery label{display:flex;align-items:flex-start;gap:10px;color:#c7ccd0;font-size:13px;line-height:1.45}.mastery input{width:18px;height:18px;margin-top:1px;accent-color:var(--o)}.masterBtn{width:100%;min-height:48px;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#151a1e;color:#888;font-weight:900}.masterBtn.ready{background:var(--o);border-color:var(--o);color:#fff}.masterBtn.done{background:var(--green);border-color:var(--green);color:#fff}.bridge{display:grid;place-items:center;color:var(--o);font-size:30px;padding-top:110px}.connection{margin-top:16px;padding:18px;border:1px solid rgba(255,106,0,.3);border-radius:16px;background:rgba(255,106,0,.06)}.connection h2{margin:0 0 10px;color:#ff9d59;font-size:18px}.connection ul{margin:0;padding-left:18px;color:#d6dadd;line-height:1.55;font-size:13px}.complete{margin-top:18px;display:grid;place-items:center}.complete button{min-width:min(360px,100%);min-height:54px;border:0;border-radius:14px;background:var(--o);color:#fff;font-weight:950;font-size:15px}.complete button:disabled{background:#252a2e;color:#777}.complete button.done{background:#fff;color:#111}.hint{margin:8px 0 0;color:var(--muted);font-size:12px;text-align:center}.nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:20px}.nav a{min-height:46px;display:flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:12px;color:#fff;text-decoration:none;background:#11161a;font-size:12px;font-weight:850}.nav a:nth-child(2){border:0;background:none;color:var(--muted)}.nav a:last-child{justify-content:flex-end}.disabled{visibility:hidden}@media(max-width:700px){.top{height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:64px 1fr 64px}.brand img{width:164px}.top>a:first-child{font-size:0}.top>a:first-child:after{content:"← Ruta";font-size:12px}.shell{padding-top:18px}.pair{grid-template-columns:1fr}.bridge{padding:0;height:38px;transform:rotate(90deg)}.nav{grid-template-columns:1fr 1fr}.nav a:nth-child(2){grid-column:1/-1;grid-row:2;justify-content:center}.toneRow{grid-template-columns:76px 1fr}}
</style></head><body><header class="top"><a id="back" href="study-projects.html">← Ruta</a><a class="brand" href="index.html?internal=1&return=studypaths"><img src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO"></a><span></span></header><main class="shell" id="root"></main><script src="assets/study-projects-v1.js?v=rebuild2"></script><script src="assets/study-path-progress-v2.js?v=rebuild2"></script><script src="assets/study-stage-lesson-v1.js?v=phase4"></script><script src="assets/study-song-release-v1.js?v=phase5b"></script><script>
const q=new URLSearchParams(location.search),id=q.get('id')||FortissimoProjects.ROAD_ID,p=FortissimoProjects.get(id),n=Math.max(1,Number(q.get('stage'))||1),idx=n-1,root=document.getElementById('root'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));back.href=`study-project.html?id=${encodeURIComponent(id)}`;
function allChecked(st,r,l){const s=FortissimoPathProgress.stageState(id,st,p.stages)[r],items=l[r].mastery||[];return items.length>0&&items.every((_,i)=>!!s.checks?.[`m${i}`])}
function metaFor(s){return FortissimoSongRelease.get(s.artist,s.title)}
function releaseCopy(m){if(!m?.verified)return'Verificando lanzamiento oficial…';const release=m.release,detail=release?.title?`${release.title}${release.date?` · ${release.date.slice(0,4)}`:''}`:'';return`✓ Lanzamiento verificado · <a href="${esc(m.youtubeUrl)}" target="_blank" rel="noopener">YouTube ↗</a>${detail?`<span class="releaseName">${esc(detail)}</span>`:''}`}
function songCard(st,r,label,l){const s=st[r],state=FortissimoPathProgress.stageState(id,st,p.stages)[r],d=l[r],ready=allChecked(st,r,l),m=metaFor(s);return`<article class="song" data-role="${r}"><div class="songTop"><div class="role">${label}</div><div class="identity"><div class="art">${m?.artwork?`<img src="${esc(m.artwork)}" alt="Portada del lanzamiento de ${esc(s.title)}">`:'♫'}</div><div><h2>${esc(s.title)}</h2><div class="artist">${esc(s.artist)}</div><div class="releaseMeta">${releaseCopy(m)}</div></div></div><p class="study"><strong>Qué vas a desarrollar:</strong><br>${esc(s.study)}</p></div><section class="block"><h3>👂 Active Listening</h3><ul>${d.listen.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="block"><h3>🎛️ Carácter tonal a buscar</h3><div class="toneGrid"><div class="toneRow"><span>Carácter</span><strong>${esc(d.tone.character)}</strong></div><div class="toneRow"><span>Amplificador</span><strong>${esc(d.tone.amp)}</strong></div><div class="toneRow"><span>Sensación</span><strong>${esc(d.tone.feel)}</strong></div></div></section><section class="block"><h3>🎯 Criterios de dominio</h3><div class="mastery">${d.mastery.map((x,i)=>`<label><input type="checkbox" data-check="${r}:m${i}" ${state.checks?.[`m${i}`]?'checked':''}>${esc(x)}</label>`).join('')}</div><button class="masterBtn ${state.learned?'done':ready?'ready':''}" data-master="${r}" ${!ready&&!state.learned?'disabled':''}>${state.learned?'✓ Canción dominada':'Marcar canción dominada'}</button></section></article>`}
async function verifySongs(st){for(const r of ['a','b']){const s=st[r];if(metaFor(s))continue;try{await FortissimoSongRelease.resolve(s.artist,s.title);render(false)}catch(e){const node=root.querySelector(`.song[data-role="${r}"] .releaseMeta`);if(node)node.textContent=e.code==='YOUTUBE_NOT_CONFIGURED'?'YouTube pendiente de conexión':e.status===404?'No verificada automáticamente':'Verificación no disponible ahora';}}}
function render(resolve=true){if(!p||!p.stages[idx]){root.innerHTML='<p>Stage no disponible.</p>';return}if(!FortissimoPathProgress.isUnlocked(id,idx,p.stages)){location.href=`study-project.html?id=${encodeURIComponent(id)}`;return}FortissimoPathProgress.setActive(id);const st=p.stages[idx],l=FortissimoStageLesson.lesson(p,st,idx),state=FortissimoPathProgress.stageState(id,st,p.stages),done=state.completed,ready=state.a.learned&&state.b.learned;document.title=`${st.title} | ${p.name}`;root.innerHTML=`<section class="hero"><p class="ey">Stage ${String(n).padStart(2,'0')} of ${p.stages.length} · ${esc(p.name)}</p><h1>${esc(st.title)}</h1><div class="why"><b>Qué vas a aprender y por qué</b><br>${esc(l.why)}<div class="skills">${l.skills.map(x=>`<span class="skill">${esc(x)}</span>`).join('')}</div></div></section><section class="pair">${songCard(st,'a','A · Learn the language',l)}<div class="bridge">→</div>${songCard(st,'b','B · Use the language',l)}</section><section class="connection"><h2>La conexión A → B</h2><ul>${l.bridge.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><div class="complete"><button id="complete" ${!ready||done?'disabled':''} class="${done?'done':''}">${done?'✓ Stage completado':'Complete Stage'}</button><p class="hint">${done?'Siguiente etapa desbloqueada.':ready?'Las dos canciones están dominadas. Ya puedes completar el Stage.':'Completa los criterios de dominio de A y B para cerrar esta etapa.'}</p></div><nav class="nav"><a class="${idx===0?'disabled':''}" href="study-stage.html?id=${encodeURIComponent(id)}&stage=${idx}">← Anterior</a><a href="study-project.html?id=${encodeURIComponent(id)}">Ver ruta completa</a><a class="${idx===p.stages.length-1||!done?'disabled':''}" href="study-stage.html?id=${encodeURIComponent(id)}&stage=${idx+2}">Siguiente →</a></nav>`;root.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{const [r,k]=el.dataset.check.split(':');FortissimoPathProgress.toggleCheck(id,st.id,r,k,p.stages);render(false)});root.querySelectorAll('[data-master]').forEach(b=>b.onclick=()=>{const r=b.dataset.master;if(allChecked(st,r,l)||FortissimoPathProgress.stageState(id,st,p.stages)[r].learned){FortissimoPathProgress.toggleLearned(id,st.id,r,p.stages);render(false)}});document.getElementById('complete').onclick=()=>{FortissimoPathProgress.completeStage(id,idx,p.stages);render(false)};if(resolve)verifySongs(st)}render();
</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
