name: Vibe Roulette CI

on:
  push:
    branches:
      - feature/vibe-roulette-engine
  pull_request:
    paths:
      - 'vibe-roulette.html'
      - 'assets/vibe-roulette*'
      - 'data/vibe-roulette/**'
      - 'tests/vibe-roulette-*'
      - '.github/workflows/vibe-roulette-ci.yml'

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Vibe Roulette engine tests
        run: node tests/vibe-roulette-engine.test.mjs
      - name: Run energy-intent and supplement tests
        run: node tests/vibe-roulette-intent.test.mjs
      - name: Run verified corpus integrity tests
        run: node tests/vibe-roulette-corpus.test.mjs
      - name: Run research candidate isolation gate
        run: node tests/vibe-roulette-candidate-gate.test.mjs
      - name: Run isolated UI smoke test
        run: node tests/vibe-roulette-ui-smoke.test.mjs
      - name: Validate Vibe Roulette JSON files
        run: |
          node -e "for (const f of ['data/vibe-roulette/schema-v1.json','data/vibe-roulette/seed-v0.json','data/vibe-roulette/corpus-v0.1.json','data/vibe-roulette/corpus-v0.2-supplement.json','data/vibe-roulette/candidate-intake-v0.2.json']) { JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('VALID', f); }"
