name: FORTISSIMO Desktop Shell CI

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'assets/login-auth.js'
      - 'assets/fortissimo-cloud-v1.js'
      - '.github/workflows/fortissimo-desktop-shell-ci.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'assets/login-auth.js'
      - 'assets/fortissimo-cloud-v1.js'
      - '.github/workflows/fortissimo-desktop-shell-ci.yml'

jobs:
  shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Desktop Phase 2 syntax, security and session contracts
        working-directory: desktop
        run: npm test
