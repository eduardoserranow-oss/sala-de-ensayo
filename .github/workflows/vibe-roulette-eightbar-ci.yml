name: Vibe Roulette Product Intelligence CI

on:
  push:
    branches:
      - main
      - feature/vibe-roulette-afro-commercial-discipline-v11
      - feature/vibe-roulette-afro-drums-v1
    paths:
      - 'vibe-roulette.html'
      - 'skykeys-sampler-lab.html'
      - 'assets/vibe-roulette-*.js'
      - 'assets/vibe-roulette-*.css'
      - 'assets/vibe-roulette/skykeys/web/**'
      - 'data/vibe-roulette/skykeys-*.json'
      - 'data/vibe-roulette/skykeys-*.csv'
      - 'tests/vibe-roulette-*.test.mjs'
      - '.github/workflows/vibe-roulette-eightbar-ci.yml'
  pull_request:
    paths:
      - 'vibe-roulette.html'
      - 'skykeys-sampler-lab.html'
      - 'assets/vibe-roulette-*.js'
      - 'assets/vibe-roulette-*.css'
      - 'assets/vibe-roulette/skykeys/web/**'
      - 'data/vibe-roulette/skykeys-*.json'
      - 'data/vibe-roulette/skykeys-*.csv'
      - 'tests/vibe-roulette-*.test.mjs'
      - '.github/workflows/vibe-roulette-eightbar-ci.yml'

jobs:
  product-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Afro-commercial calibration
        run: node tests/vibe-roulette-afro-commercial.test.mjs
      - name: Eight-bar A/A-prime V2 and seamless-loop contract
        run: node tests/vibe-roulette-eightbar.test.mjs
      - name: Story Intelligence V2, Mood and 90-150 BPM contract
        run: node tests/vibe-roulette-story-intelligence.test.mjs
      - name: Keyboard performance diversity, key rotation and modern lineage
        run: node tests/vibe-roulette-performance-lineage.test.mjs
      - name: Neo-Soul Player harmonic safety, voice leading, gestures and dynamics
        run: node tests/vibe-roulette-neo-soul-player.test.mjs
      - name: Human Pianist V1.3 Reference DNA B1
        run: node tests/vibe-roulette-human-pianist-v13.test.mjs
      - name: Song Starter Phase 3 role-aware players
        run: node tests/vibe-roulette-role-aware-players-v1.test.mjs
      - name: Song Starter Phase 4.2 two-layer Foundation + Texture lock
        run: node tests/vibe-roulette-songstarter-phase4.test.mjs
      - name: Song Starter Phase 4.2 M2 Texture mute and dormant Hook archive
        run: node tests/vibe-roulette-phase41-human-hook.test.mjs
      - name: Phase 4.3 Afro Harmony Reference DNA progression composer
        run: node tests/vibe-roulette-afro-harmony-dna-v2.test.mjs
      - name: Phase 4.4 progression anti-repeat and creative chord editor
        run: node tests/vibe-roulette-progression-editor-v1.test.mjs
      - name: Phase 5 A/A-prime arrangement intelligence
        run: node tests/vibe-roulette-arrangement-intelligence-v1.test.mjs
      - name: Phase 6 Song Starter ZIP and separated MIDI export
        run: node tests/vibe-roulette-songstarter-export-v1.test.mjs
      - name: Neo-Soul Player V1.2 Afro commercial discipline and pocket
        run: node tests/vibe-roulette-afro-commercial-discipline-v11.test.mjs
      - name: Afro language V1.2 evidence and pocket
        run: node tests/vibe-roulette-afro-language-v12.test.mjs
      - name: Serra emotion and chord editing
        run: node tests/vibe-roulette-serra-emotion-and-editing.test.mjs
      - name: Afro drums V1 transport, selection and taste training
        run: node tests/vibe-roulette-afro-drums-v1.test.mjs
      - name: Phase 1.5 shared section transport and Phase 2 MIDI
        run: node tests/vibe-roulette-phase15-phase2.test.mjs
      - name: S.K.Y. Keys Phase 2 isolated sampler
        run: node tests/vibe-roulette-skykeys-phase2.test.mjs
      - name: S.K.Y. Keys Phase 3 reusable sound engine
        run: node tests/vibe-roulette-skykeys-phase3.test.mjs
      - name: S.K.Y. Keys Phase 4 sound direction intelligence
        run: node tests/vibe-roulette-skykeys-phase4.test.mjs
      - name: S.K.Y. Keys Phase 5 Vibe Roulette integration
        run: node tests/vibe-roulette-skykeys-phase5.test.mjs
      - name: S.K.Y. Keys hosted AAC M4A Supabase web bank
        run: node tests/vibe-roulette-skykeys-web-pack.test.mjs