name: Vibe Roulette Product Intelligence CI

on:
  push:
    branches:
      - feature/vibe-roulette-afro-commercial-discipline-v11
    paths:
      - 'vibe-roulette.html'
      - 'assets/vibe-roulette-*.js'
      - 'assets/vibe-roulette-*.css'
      - 'tests/vibe-roulette-*.test.mjs'
      - '.github/workflows/vibe-roulette-eightbar-ci.yml'
  pull_request:
    paths:
      - 'vibe-roulette.html'
      - 'assets/vibe-roulette-*.js'
      - 'assets/vibe-roulette-*.css'
      - 'tests/vibe-roulette-*.test.mjs'
      - '.github/workflows/vibe-roulette-eightbar-ci.yml'

jobs:
  product-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Afro-commercial calibration
        run: node tests/vibe-roulette-afro-commercial.test.mjs
      - name: Eight-bar A/A-prime V2 and seamless-loop contract
        run: node tests/vibe-roulette-eightbar.test.mjs
      - name: Story Intelligence V2, Mood and 68-170 BPM contract
        run: node tests/vibe-roulette-story-intelligence.test.mjs
      - name: Keyboard performance diversity, key rotation and modern lineage
        run: node tests/vibe-roulette-performance-lineage.test.mjs
      - name: Neo-Soul Player harmonic safety, voice leading, gestures and dynamics
        run: node tests/vibe-roulette-neo-soul-player.test.mjs
      - name: Neo-Soul Player V1.2 Afro commercial discipline and pocket
        run: node tests/vibe-roulette-afro-commercial-discipline-v11.test.mjs
      - name: Afro language V1.2 evidence and pocket
        run: node tests/vibe-roulette-afro-language-v12.test.mjs
