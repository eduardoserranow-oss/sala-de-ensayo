<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Editar Study Path | FORTISSIMO</title><meta name="theme-color" content="#050505"><link rel="icon" href="assets/fortissimo-icon-20260824.svg"><style>:root{--o:#ff6a00;--bg:#07090b;--muted:#a5abb0;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}.top{height:76px;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07090b;z-index:20}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:850}.brand{justify-self:center}.brand img{width:190px}.shell{width:min(900px,calc(100% - 28px));margin:auto;padding:28px 0 90px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end}.hero h1{margin:5px 0 0;font-size:42px;letter-spacing:-.05em}.ey{color:#ff9d59;font-size:12px;font-weight:900;text-transform:uppercase}.heroActions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:#12171b;color:#fff;font-weight:850;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--o);border-color:var(--o)}.objective{color:var(--muted);line-height:1.5;max-width:650px}.list{display:grid;gap:10px;margin-top:22px}.stage{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:#11161a}.num{width:38px;height:38px;border-radius:10px;background:rgba(255,106,0,.12);color:var(--o);display:grid;place-items:center;font-weight:900}.stage h3{margin:0;font-size:16px}.songs{color:var(--muted);font-size:12px;margin-top:4px}.stageActions{display:flex;gap:6px}.mini{height:38px;min-width:38px;border:1px solid var(--line);border-radius:9px;background:#0c1013;color:#fff}.empty{padding:32px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}dialog{width:min(680px,calc(100% - 22px));max-height:calc(100svh - 20px);overflow:auto;border:1px solid var(--line);border-radius:20px;background:#11161a;color:#fff;padding:0}.modal{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin-top:12px}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#080b0d;color:#fff;font:inherit;font-size:16px}.field textarea{min-height:82px}.section{margin:20px 0 0;color:#ff9d59;font-size:11px;font-weight:900;text-transform:uppercase;border-top:1px solid var(--line);padding-top:16px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:650px){.top{height:calc(70px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);grid-template-columns:64px 1fr 64px}.brand img{width:164px}.top>a:first-child{font-size:0}.top>a:first-child:after{content:"← Ruta";font-size:12px}.hero{align-items:flex-start;flex-direction:column}.heroActions{display:grid;grid-template-columns:1fr 1fr;width:100%}.hero h1{font-size:34px}.stage{grid-template-columns:38px 1fr}.stageActions{grid-column:1/-1;justify-content:flex-end}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><header class="top"><a id="back" href="study-projects.html">← Ruta</a><a class="brand" href="index.html?internal=1&return=studypaths"><img src="assets/fortissimo-header-logo.jpg?v=fortissimo-header4" alt="FORTISSIMO"></a><span></span></header><main class="shell" id="root"></main><dialog id="dlg"><form class="modal" id="form"><h2 id="formTitle">Nueva etapa</h2><input type="hidden" name="stageId"><div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Objetivo</label><textarea name="objective" required></textarea></div><p class="section">Canción A · lenguaje</p><div class="grid"><div class="field"><label>Artista</label><input name="aArtist" required></div><div class="field"><label>Canción</label><input name="aTitle" required></div><div class="field full"><label>Qué estudiar</label><textarea name="aStudy" required></textarea></div></div><p class="section">Canción B · aplicación</p><div class="grid"><div class="field"><label>Artista</label><input name="bArtist" required></div><div class="field"><label>Canción</label><input name="bTitle" required></div><div class="field full"><label>Qué estudiar</label><textarea name="bStudy" required></textarea></div><div class="field full"><label>Conexión A → B</label><textarea name="connection" required></textarea></div></div><div class="modalActions"><button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary">Guardar etapa</button></div></form></dialog><script src="assets/study-projects-v1.js?v=rebuild1"></script><script>const q=new URLSearchParams(location.search),id=q.get("id"),root=document.getElementById("root"),dlg=document.getElementById("dlg"),form=document.getElementById("form"),esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));let dragged=null;function get(){return FortissimoProjects.get(id)}function stageCard(s,i,total){return`<article class="stage" draggable="true" data-i="${i}"><div class="num">${String(i+1).padStart(2,"0")}</div><div><h3>${esc(s.title)}</h3><div class="songs">A · ${esc(s.a.title)} &nbsp;→&nbsp; B · ${esc(s.b.title)}</div></div><div class="stageActions"><button class="mini" data-up="${i}" ${i===0?"disabled":""}>↑</button><button class="mini" data-down="${i}" ${i===total-1?"disabled":""}>↓</button><button class="mini" data-edit="${esc(s.id)}">✎</button><button class="mini" data-del="${esc(s.id)}">×</button></div></article>`}function render(){const p=get();if(!p||p.system){root.innerHTML='<div class="empty">Este proyecto no se puede editar aquí.</div>';return}back.href=`study-project.html?id=${encodeURIComponent(id)}`;root.innerHTML=`<section class="hero"><div><p class="ey">${esc(p.instrument)} · Editor</p><h1>${esc(p.name)}</h1><p class="objective">${esc(p.objective)}</p></div><div class="heroActions"><a class="btn" href="study-path-adapt.html?id=${encodeURIComponent(id)}">✦ Adaptar con IA</a><button class="btn primary" data-add>+ Agregar etapa</button></div></section><section class="list">${p.stages.length?p.stages.map((s,i)=>stageCard(s,i,p.stages.length)).join(""):'<div class="empty">Aún no hay etapas. Agrega la primera dupla A → B.</div>'}</section>`;bind()}function openStage(s=null){form.reset();form.stageId.value=s?.id||"";formTitle.textContent=s?"Editar etapa":"Nueva etapa";if(s){const v={title:s.title,objective:s.objective,aArtist:s.a.artist,aTitle:s.a.title,aStudy:s.a.study,bArtist:s.b.artist,bTitle:s.b.title,bStudy:s.b.study,connection:s.connection};Object.entries(v).forEach(([k,x])=>form.elements[k].value=x)}dlg.showModal()}function bind(){root.querySelector("[data-add]")?.addEventListener("click",()=>openStage());root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openStage(get().stages.find(s=>s.id===b.dataset.edit)));root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar esta etapa?")){FortissimoProjects.removeStage(id,b.dataset.del);render()}});root.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{FortissimoProjects.moveStage(id,+b.dataset.up,+b.dataset.up-1);render()});root.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{FortissimoProjects.moveStage(id,+b.dataset.down,+b.dataset.down+1);render()});root.querySelectorAll(".stage").forEach(c=>{c.ondragstart=()=>dragged=+c.dataset.i;c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();FortissimoProjects.moveStage(id,dragged,+c.dataset.i);render()}})}form.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));FortissimoProjects.saveStage(id,d,d.stageId||null);dlg.close();render()};cancel.onclick=()=>dlg.close();render();</script><script src="assets/internal-navigation-v1.js?v=nav1"></script></body></html>
