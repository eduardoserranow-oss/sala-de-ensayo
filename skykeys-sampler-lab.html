<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>S.K.Y. Keys Sampler Lab</title><style>body{margin:0;background:#0d0d0d;color:#fff;font-family:Inter,system-ui,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 56px}h1{font-size:28px;margin:0 0 8px}.muted{color:#aaa}.card{background:#181818;border:1px solid #2b2b2b;border-radius:18px;padding:18px;margin:16px 0}label{display:block;font-weight:700;margin:10px 0 6px}select,input,button{font:inherit}select,input[type=file]{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #3a3a3a;border-radius:12px;padding:12px}button{background:#ff5a00;color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:800}button.secondary{background:#252525}.keys{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:14px}.keys button{border-radius:12px;padding:18px 4px}.row{display:flex;gap:10px;flex-wrap:wrap}.status{font-family:ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;font-size:12px;color:#cfcfcf;max-height:260px;overflow:auto}.ok{color:#9be19b}.warn{color:#ffc36b}</style></head><body><main><h1>S.K.Y. Keys · Phase 2 Lab</h1><p class="muted">Isolated sampler prototype. It does not modify Vibe Roulette, the chord generator or the pianist.</p><section class="card"><label>Select your local <b>S.K.Y. Keys</b> folder</label><input id="folder" type="file" webkitdirectory directory multiple><p class="muted">The prototype indexes only the seven pilot presets and lazy-decodes samples when a note is played.</p><label>Preset</label><select id="preset"></select><div id="guard"></div><div class="keys" id="keys"></div><div class="row" style="margin-top:14px"><button id="chord">Play Cmaj9</button><button id="stop" class="secondary">Stop</button></div></section><section class="card"><b>Indexed samples</b><div id="inventory" class="status">Choose the local folder first.</div></section><section class="card"><b>Playback log</b><div id="status" class="status"></div></section></main><script type="module">import{SkyKeysSamplerPrototype,SKYKEYS_PILOT_PRESETS,assertProducerGuardrail}from'./assets/vibe-roulette-skykeys-sampler-prototype-v1.js';const $=s=>document.querySelector(s),log=o=>{$('#status').textContent=JSON.stringify(o,null,2)+'\n'+$('#status').textContent};const sampler=new SkyKeysSamplerPrototype({onStatus:log});for(const n of Object.keys(SKYKEYS_PILOT_PRESETS)){const o=document.createElement('option');o.value=o.textContent=n;$('#preset').append(o)}function syncGuard(){const g=assertProducerGuardrail($('#preset').value,'main_harmony');$('#guard').className=g.allowed?'ok':'warn';$('#guard').textContent=g.allowed?'Main-harmony routing allowed':'Guardrail: full pianist voicings blocked for this preset'}$('#preset').onchange=()=>{sampler.setPreset($('#preset').value);syncGuard()};syncGuard();$('#folder').onchange=e=>{const inv=sampler.setFiles(e.target.files);$('#inventory').textContent=JSON.stringify(inv,null,2)};const notes=[48,52,55,59,60,64,67,71];for(const n of notes){const b=document.createElement('button');b.textContent=n;b.onclick=()=>sampler.noteOn(n,96,{duration:.8}).catch(err=>log({error:String(err)}));$('#keys').append(b)}$('#chord').onclick=()=>Promise.all([60,64,67,71].map((m,i)=>new Promise(r=>setTimeout(()=>{sampler.noteOn(m,92-i*4,{duration:1.6}).finally(r)},i*30))));$('#stop').onclick=()=>sampler.stopAll();</script></body></html>
